<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Legacy League Golf — Season Film (demo)</title>
<meta name="description" content="Demo concept: Legacy League Golf as a card film — live team best-ball scoring, eleven city hubs and every player, one screen each. English and Spanish. Sample data.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="Legacy League Golf — concept demo">
<meta property="og:description" content="Live team best-ball scoring, a Stories collage, eleven city hubs and every player as a card film. Sample data, built for the Legacy League bid.">
<meta property="og:url" content="https://carlodemarchis-stack.github.io/legacy-league-r2dybv29/">
<meta property="og:image" content="https://carlodemarchis-stack.github.io/legacy-league-r2dybv29/img/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Legacy League Golf — concept demo">
<meta name="twitter:image" content="https://carlodemarchis-stack.github.io/legacy-league-r2dybv29/img/og.jpg">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#080c0e; --panel:rgba(255,255,255,.055); --panel2:rgba(255,255,255,.014);
  --line:rgba(160,180,190,.14); --ink:#eef3f2; --dim:#97a6a8; --dim2:#66757a;
  --acc:#d9ad4e; --green:#39b26f; --red:#e4645b; --live:#ff4d4d;
  --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
a{color:var(--acc);text-decoration:none}

/* ------------------------------------------------------------- film */
#film{position:fixed;inset:0;display:flex;transition:transform .55s cubic-bezier(.16,.84,.34,1)}
.card{flex:0 0 100vw;width:100vw;height:100dvh;position:relative;overflow:hidden;
  content-visibility:auto;contain-intrinsic-size:100vw 100dvh}
.card::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(90% 60% at 50% 120%,var(--c,rgba(217,173,78,.25)) 0%,transparent 60%);opacity:.32}
.inner{position:absolute;inset:0;z-index:1;padding:clamp(18px,3.2vw,54px);
  padding-top:clamp(56px,8vh,84px);padding-bottom:clamp(76px,9.5vh,104px);display:flex;gap:clamp(16px,2.4vw,40px)}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;gap:clamp(10px,1.6vh,18px)}
.col.l{flex:0 0 44%}.col.r{flex:1 1 auto}
.box{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:16px;padding:clamp(10px,1.3vh,16px) clamp(12px,1.3vw,20px);min-width:0}
.box.grow{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin;overscroll-behavior:contain}
.legend{font-size:clamp(8.5px,.82vw,10.5px);letter-spacing:.2em;text-transform:uppercase;color:var(--dim2);
  font-weight:700;margin-bottom:clamp(5px,.85vh,10px);display:flex;justify-content:space-between;align-items:center;gap:8px}
.legend .live{color:var(--live)}
.kicker{font-size:clamp(9.5px,.9vw,12px);letter-spacing:.22em;text-transform:uppercase;color:var(--acc);font-weight:700}
h1.big{font-size:clamp(34px,5.2vw,78px);font-weight:700;letter-spacing:-.04em;line-height:.95}
h2.big{font-size:clamp(26px,3.4vw,50px);font-weight:700;letter-spacing:-.035em;line-height:1}
p.lead{font-size:clamp(13px,1.15vw,17px);line-height:1.5;color:var(--dim);max-width:60ch}
p.lead b{color:var(--ink);font-weight:700}
.grid{display:grid;gap:clamp(6px,.9vw,14px)}
.grid.c3{grid-template-columns:repeat(3,1fr)}.grid.c4{grid-template-columns:repeat(4,1fr)}
.grid.c5{grid-template-columns:repeat(5,1fr)}.grid.c2{grid-template-columns:repeat(2,1fr)}
.cell{min-width:0}.cell small{display:block;font-size:clamp(8.5px,.8vw,10.5px);letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell b{display:block;font-size:clamp(17px,1.9vw,28px);font-weight:700;letter-spacing:-.02em;margin-top:2px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.cell b.u{color:var(--green)}.cell b.o{color:var(--red)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);
  background:rgba(12,16,20,.55);color:var(--dim);font-size:clamp(9px,.82vw,11px);letter-spacing:.1em;text-transform:uppercase;
  font-weight:700;transition:.18s;white-space:nowrap}
button.pill:hover{color:var(--acc);border-color:rgba(217,173,78,.5)}
.pill.on{color:#1a1206;background:var(--acc);border-color:var(--acc)}
.pill.follow.on{background:var(--green);border-color:var(--green)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 rgba(255,77,77,.6);animation:pulse 1.6s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,77,77,0)}100%{box-shadow:0 0 0 0 rgba(255,77,77,0)}}
.sponsor{display:flex;align-items:center;gap:10px;font-size:clamp(9px,.82vw,11px);letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim2);font-weight:700}
.sponsor i{flex:0 0 auto;display:inline-grid;place-items:center;height:26px;padding:0 12px;border:1px dashed rgba(217,173,78,.5);
  border-radius:7px;font-style:normal;color:var(--acc);letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 6px;border-radius:999px;border:1px solid var(--line);
  background:rgba(255,255,255,.03);font-size:12px;color:var(--dim);transition:.18s}
.chip i{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.chip:hover{color:var(--ink);border-color:var(--c)}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--c);vertical-align:-1px;margin-right:7px}

/* --------------------------------------------------------------- live */
.lbhead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.lbhead .meta{font-size:clamp(10px,.95vw,13px);color:var(--dim);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.lbhead .meta b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.ctrls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stale{display:none;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;border:1px solid rgba(228,100,91,.5);
  background:rgba(228,100,91,.12);font-size:12px;color:#ffc9c5}
.stale.on{display:flex}
.stale b{color:#fff}
.lb{display:flex;flex-direction:column;gap:3px}
.lbr{display:grid;grid-template-columns:38px minmax(0,1fr) 62px 52px 62px 52px;align-items:center;gap:8px;
  padding:8px 10px;border-radius:11px;border:1px solid transparent;font-size:clamp(12px,1.05vw,15px);
  font-variant-numeric:tabular-nums;transition:.18s;cursor:pointer;text-align:right}
.lbr.h{cursor:default;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);padding-top:2px;padding-bottom:4px}
.lbr:not(.h):hover{background:rgba(255,255,255,.04);border-color:var(--line)}
.lbr.sel{background:rgba(217,173,78,.1);border-color:rgba(217,173,78,.45)}
.lbr.fol{box-shadow:inset 3px 0 0 var(--green)}
.lbr .pos{text-align:left;font-weight:700;color:var(--dim)}
.lbr .nm{text-align:left;display:flex;align-items:center;gap:9px;min-width:0;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lbr .nm em{font-style:normal;font-weight:300;color:var(--dim2);font-size:.82em}
.lbr .u{color:var(--green);font-weight:700}.lbr .o{color:var(--red);font-weight:700}.lbr .e{color:var(--dim)}
.lbr .thru{color:var(--dim)}
.lbr .pts{color:var(--acc);font-weight:700}
.lbr .pts.prov{color:var(--dim2);font-weight:300}
.lbfoot{font-size:11px;color:var(--dim2);line-height:1.5;margin-top:6px}
.lbfoot b{color:var(--dim)}

.rt{display:flex;gap:4px;margin-left:auto}
.rt button{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.rt button.on{color:var(--ink);border-color:var(--acc);background:rgba(217,173,78,.14)}
.scwrap{overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.scg{display:grid;grid-template-columns:96px repeat(9,1fr) 32px repeat(9,1fr) 32px 38px;gap:2px;align-items:center;min-width:560px}
.scg > div{text-align:center;font-size:10.5px;font-variant-numeric:tabular-nums;min-height:22px;display:grid;place-items:center}
.scg .lab{justify-items:start;text-align:left;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:22px}
.scg .lab b{color:var(--ink);font-weight:700}
.scg .lab small{color:var(--dim2);font-size:9.5px;margin-left:5px}
.scg .hn{color:var(--dim2);font-size:9.5px}.scg .pr{color:var(--dim);font-size:10px}
.scg .sub{font-weight:700;color:var(--dim);background:rgba(255,255,255,.04);border-radius:5px}
.scg .tot{font-weight:700;color:var(--ink);background:rgba(255,255,255,.07);border-radius:5px}
.scg .tot.u{color:var(--green)}.scg .tot.o{color:var(--red)}
.scg .team > div, .scg .team{background:rgba(217,173,78,.08)}
.scg .trow{border-top:1px solid var(--line);margin-top:3px;padding-top:3px}
.sq{display:inline-grid;place-items:center;width:20px;height:20px;font-weight:700;font-size:11px;line-height:1;position:relative;color:var(--dim)}
.sq.eagle{background:var(--acc);color:#160c02;border-radius:50%}
.sq.birdie{border:1.5px solid var(--green);color:var(--green);border-radius:50%}
.sq.bogey{border:1.5px solid rgba(160,180,190,.4);color:var(--ink);border-radius:4px}
.sq.dbl{background:rgba(228,100,91,.22);border:1.5px solid rgba(228,100,91,.55);color:#ffb3b0;border-radius:4px}
.sq.cnt::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--acc);opacity:.9}
.sq.prov{opacity:.55}
.sq.none{color:var(--dim2);font-weight:300}
.sq.team{color:var(--ink)}.sq.team.u{color:var(--green)}.sq.team.o{color:var(--red)}
.sq.team.prov{color:var(--dim2)}
.sclegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:10px;color:var(--dim2);align-items:center}
.sclegend span{display:flex;gap:5px;align-items:center}

/* ---------------------------------------------------------------- city */
.cityhero{display:flex;align-items:flex-start;gap:clamp(10px,1.4vw,22px)}
.cityhero .code{font-size:clamp(70px,9vw,150px);font-weight:700;letter-spacing:-.06em;line-height:.8;color:var(--c);
  text-shadow:0 10px 40px rgba(0,0,0,.5)}
.cityhero .meta{display:flex;flex-direction:column;gap:5px;min-width:0;padding-top:4px}
.cityhero .meta .nm{font-size:clamp(20px,2.3vw,34px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.cityhero .meta .teams{font-size:clamp(10px,.9vw,12px);color:var(--dim2);letter-spacing:.06em}
.standing{display:flex;align-items:baseline;gap:10px}
.standing b{font-size:clamp(28px,3.4vw,50px);font-weight:700;letter-spacing:-.04em;line-height:1}
.standing span{font-size:clamp(11px,1vw,14px);color:var(--dim)}
.roster{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(6px,.8vw,10px)}
.rtile{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--line);
  background:rgba(255,255,255,.025);min-width:0;cursor:pointer;transition:.18s;text-align:left}
.rtile:hover{border-color:var(--c);background:rgba(255,255,255,.05)}
.ava img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:50%;display:block}
.ava{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;overflow:hidden;
  background:linear-gradient(160deg,var(--c),color-mix(in srgb,var(--c) 45%,#000));color:#fff;letter-spacing:-.02em;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.rtile .t{min-width:0;flex:1 1 auto}
.rtile .t b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtile .t small{display:block;font-size:10.5px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.rtile .sc{flex:0 0 auto;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;font-weight:700}
.rtile .sc small{display:block;font-size:9px;color:var(--dim2);font-weight:300;letter-spacing:.1em}
.cap{display:inline-block;font-size:8.5px;letter-spacing:.12em;padding:1px 5px;border-radius:4px;background:var(--acc);color:#1a1206;font-weight:700;vertical-align:1px;margin-left:5px}
.vids{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vid{aspect-ratio:16/9;border-radius:10px;border:1px solid var(--line);position:relative;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 35%,#000),#0b0f11)}
.vid::after{content:"";position:absolute;left:50%;top:50%;width:0;height:0;transform:translate(-40%,-50%);
  border-left:14px solid rgba(255,255,255,.85);border-top:9px solid transparent;border-bottom:9px solid transparent}
.vid span{position:absolute;left:8px;bottom:6px;right:8px;font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* -------------------------------------------------------------- player */
.ptop{display:flex;gap:clamp(12px,1.8vw,26px);align-items:stretch}
.pphoto{flex:0 0 clamp(120px,13vw,200px);aspect-ratio:7/8;border-radius:var(--r);position:relative;overflow:hidden;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 55%,#000),#0a0d10);border:1px solid var(--line);display:grid;place-items:center}
.pphoto .ini{font-size:clamp(44px,5.5vw,84px);font-weight:700;letter-spacing:-.05em;color:rgba(255,255,255,.9)}
.pphoto .num{position:absolute;right:10px;top:6px;font-size:clamp(44px,5.5vw,84px);font-weight:700;color:rgba(255,255,255,.08);line-height:1;letter-spacing:-.05em}
.pphoto .cut{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:96%;width:auto;max-width:none;object-fit:contain;object-position:bottom;z-index:1;filter:drop-shadow(0 12px 28px rgba(0,0,0,.55))}
.pphoto small{position:absolute;left:0;right:0;bottom:8px;z-index:2;text-align:center;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}
.pinfo{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
.pinfo .nm{font-size:clamp(24px,2.8vw,42px);font-weight:700;letter-spacing:-.035em;line-height:1}
.pinfo .sub{font-size:clamp(11px,1vw,14px);color:var(--dim)}
.pinfo .sub b{color:var(--ink);font-weight:700}
.bio{font-size:clamp(12px,1vw,14.5px);line-height:1.55;color:var(--dim)}

/* -------------------------------------------------------------- season */
.sched{display:flex;flex-direction:column;gap:5px}
.ev{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-radius:12px;
  border:1px solid var(--line);background:rgba(255,255,255,.025);font-size:13px}
.ev.live{border-color:rgba(255,77,77,.5)}
.ev .n{font-weight:700;color:var(--dim2)}.ev b{display:block;font-weight:700}.ev small{color:var(--dim2);font-size:11px}
.ev .st{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);display:flex;gap:7px;align-items:center}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:34px minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums}
.bar .tr{height:16px;border-radius:5px;background:rgba(255,255,255,.04);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--c);border-radius:5px;transition:width .6s}
.bar b{text-align:right;color:var(--acc)}
.bar .cd{font-weight:700;color:var(--dim)}

/* ------------------------------------------------------------- stories */
.st-col{flex:1 1 auto;gap:12px}
.st-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search{flex:1 1 320px;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;height:46px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);transition:.18s}
.search:focus-within{border-color:rgba(217,173,78,.6);background:rgba(255,255,255,.07);box-shadow:0 0 0 4px rgba(217,173,78,.1)}
.search svg{flex:0 0 auto;width:18px;height:18px;fill:none;stroke:var(--dim);stroke-width:2;stroke-linecap:round}
.search input{flex:1 1 auto;min-width:0;background:none;border:0;outline:none;font-size:15px;color:var(--ink);height:100%}
.search input::placeholder{color:var(--dim2)}
.search input::-webkit-search-cancel-button{display:none}
.search button{flex:0 0 auto;width:26px;height:26px;border-radius:50%;color:var(--dim);font-size:18px;line-height:1;display:none;place-items:center}
.search.has button{display:grid}
.search button:hover{background:rgba(255,255,255,.08);color:var(--ink)}
.filters{display:flex;gap:5px;flex-wrap:wrap}
.filters button{display:flex;align-items:center;gap:7px;padding:0 13px;height:34px;border-radius:999px;border:1px solid var(--line);
  color:var(--dim);font-size:12px;letter-spacing:.04em;transition:.18s;white-space:nowrap}
.filters button:hover{color:var(--ink);border-color:rgba(255,255,255,.3)}
.filters button.on{background:var(--acc);border-color:var(--acc);color:#1a1206}
.filters button small{font-size:10.5px;color:inherit;opacity:.7;font-variant-numeric:tabular-nums}
.st-count{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2);margin-left:auto;white-space:nowrap}
/* the collage: a dense 8-column grid, every story a photo tile sized by its weight */
.feed{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin;overscroll-behavior:contain;display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));grid-auto-rows:clamp(70px,10.5vh,108px);grid-auto-flow:dense;gap:8px;
  padding:2px 6px 40px 2px;align-content:start}
.tile{position:relative;border-radius:16px;overflow:hidden;background:#0b0f11;border:1px solid var(--line);cursor:pointer;min-height:0;
  grid-column:span 2;grid-row:span 2;text-align:left;color:var(--ink)}
.tile.s{grid-row:span 1}.tile.l{grid-column:span 3}.tile.xl{grid-column:span 4;grid-row:span 3}.tile.r{grid-column:span 3;grid-row:span 3}
.tile.p{grid-column:span 2;grid-row:span 3}  /* portrait photo: a tall tile, no forced wide crop */
.tile.p h3{font-size:clamp(14px,1.25vw,19px)}.tile.p p{display:none}
.tile.p .shade{background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 25%,rgba(0,0,0,0) 50%,rgba(5,8,10,.94) 100%)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1);filter:saturate(.92)}
.tile:hover img{transform:scale(1.04)}
.tile .shade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,0) 45%,rgba(5,8,10,.92) 100%)}
.tile .top{position:absolute;left:10px;right:10px;top:9px;z-index:2;display:flex;align-items:center;gap:7px;min-width:0}
.tile .top .ava{width:24px;height:24px;font-size:9px;flex:0 0 auto}
.tile .top b{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.tile .top .badge{margin-left:auto;flex:0 0 auto;padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);
  font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums}
.tile .top .badge.live{background:rgba(255,77,77,.85);color:#fff}
.tile .bot{position:absolute;left:12px;right:12px;bottom:10px;z-index:2;min-width:0}
.tile h3{font-size:clamp(12.5px,1.05vw,16px);font-weight:700;letter-spacing:-.02em;line-height:1.2;text-shadow:0 1px 8px rgba(0,0,0,.7);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tile.l h3{font-size:clamp(15px,1.4vw,21px)}.tile.xl h3{font-size:clamp(20px,2.2vw,32px);-webkit-line-clamp:2}
.tile p{font-size:11.5px;line-height:1.4;color:rgba(255,255,255,.78);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile.s p,.tile.m p{display:none}
.tile.s h3{-webkit-line-clamp:2}
.tile .meta{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:10.5px;color:rgba(255,255,255,.82);min-width:0}
.tile .meta button{display:flex;align-items:center;gap:4px;color:inherit;font-size:10.5px;font-variant-numeric:tabular-nums;padding:2px 0}
.tile .meta button.on{color:#ff8a82}
.tile .meta svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tile .meta button.on svg{fill:currentColor}
.tile .meta .tag{margin-left:auto;display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 4px;border-radius:999px;background:rgba(0,0,0,.5);
  backdrop-filter:blur(6px);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
.tile .meta .tag i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:0 0 auto}
.tile.s .meta{display:none}
.tile .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-60%);z-index:2;width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(8px);display:grid;place-items:center}
.tile .play::after{content:"";margin-left:3px;border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent}
.tile.xl .play{width:60px;height:60px}
.tile.s .play{display:none}
.tile.gallery .mosaic{position:absolute;inset:0;display:grid;grid-template-columns:3fr 2fr;grid-template-rows:1fr 1fr;gap:2px;background:#000}
.tile.gallery .mosaic img{position:static;width:100%;height:100%;min-height:0}
.tile.gallery .mosaic img:first-child{grid-row:1/3}
.tile.quote img{opacity:.3;filter:grayscale(1) contrast(1.1)}
.tile.quote .shade{background:linear-gradient(150deg,color-mix(in srgb,var(--c) 72%,#000) 0%,rgba(8,12,14,.55) 100%)}
.tile.quote .q{position:absolute;inset:0;z-index:2;padding:40px 14px 50px;display:flex;align-items:center;font-size:clamp(13px,1.15vw,18px);
  font-weight:700;line-height:1.25;letter-spacing:-.02em;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.tile.quote h3{display:none}
.tile.result img{opacity:.4}
.tile.result .shade{background:linear-gradient(180deg,rgba(5,8,10,.6),rgba(5,8,10,.94))}
.tile.result .board{position:absolute;left:10px;right:10px;top:40px;z-index:2}
.tile.result .board .lbr{font-size:12px;padding:5px 6px;grid-template-columns:28px minmax(0,1fr) 48px 36px 48px;gap:5px}
.tile.result .board .lbr.h{font-size:9px;padding-bottom:2px}
.tile.result h3{font-size:13px;-webkit-line-clamp:1}
.tile.result p{display:none}
.card .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.22;z-index:0;
  -webkit-mask-image:linear-gradient(180deg,#000 10%,transparent 100%);mask-image:linear-gradient(180deg,#000 10%,transparent 100%)}
.card[data-k="city"] .bg{opacity:.13}
.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.vid::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.75));z-index:1}
.vid::after{z-index:2}.vid span{z-index:2}
.empty{grid-column:1/-1;padding:30px 20px;text-align:center;color:var(--dim2);font-size:13px;line-height:1.5;border:1px dashed var(--line);border-radius:16px}

/* ------------------------------------------------------------- mission */
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}
.form input,.form select{padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);font-size:14px;outline:none}
.form input:focus,.form select:focus{border-color:var(--acc)}
.form .ck{grid-column:1/-1;flex-direction:row;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:12px;color:var(--dim)}
.form .ck input{width:16px;height:16px;accent-color:var(--acc)}
.form button{grid-column:1/-1;padding:11px;border-radius:10px;background:var(--acc);color:#1a1206;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.ok{font-size:12px;color:var(--green);margin-top:6px}
.res{display:flex;gap:14px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid rgba(57,178,111,.45);background:rgba(57,178,111,.08)}
.res b{font-size:clamp(22px,2.6vw,36px);font-weight:700;letter-spacing:-.03em;color:var(--green)}
.res span{font-size:12.5px;color:var(--dim);line-height:1.4}

/* ------------------------------------------------------------- chrome */
#topbar{position:fixed;left:0;right:0;top:0;z-index:40;display:flex;align-items:center;gap:14px;
  padding:11px clamp(18px,3.2vw,54px);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim2);
  background:linear-gradient(180deg,rgba(8,12,14,.9),rgba(8,12,14,0));pointer-events:none}
#topbar > *{pointer-events:auto}
#topbar b{color:var(--ink);font-weight:700}
#topbar .home{color:inherit;transition:.18s}
#topbar .home:hover b{color:var(--acc)}
#topbar .tb-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tb-tabs{display:flex;gap:4px;margin-left:auto}
#tb-tabs button{padding:6px 14px;border-radius:999px;border:1px solid transparent;letter-spacing:.14em;color:var(--dim);transition:.18s;white-space:nowrap}
#tb-tabs button:hover{color:var(--ink)}
#tb-tabs button.on{color:var(--ink);border-color:var(--line);background:rgba(255,255,255,.07)}
#topbar .tb-r{white-space:nowrap}
#bar{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:4px;
  background:rgba(10,14,16,.84);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:999px;padding:5px 7px}
#bar button:not(#count){width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--dim);transition:.18s}
#bar button:not(#count):hover{background:rgba(255,255,255,.09);color:var(--ink)}
#bar svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#count{font-size:11px;letter-spacing:.1em;color:var(--dim);padding:5px 11px;font-variant-numeric:tabular-nums;white-space:nowrap}
#count b{color:var(--ink);font-weight:700}
#toast{position:fixed;left:50%;top:max(64px,calc(env(safe-area-inset-top) + 56px));transform:translate(-50%,-20px);z-index:50;opacity:0;
  transition:.3s;pointer-events:none;display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:14px;
  background:rgba(14,18,22,.96);border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.6);max-width:min(92vw,420px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast i{flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:var(--acc);display:grid;place-items:center;font-style:normal;font-weight:700;color:#1a1206;font-size:12px}
#toast b{display:block;font-size:12.5px}#toast span{display:block;font-size:11.5px;color:var(--dim)}
#toast small{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);margin-top:2px}
.demo{position:fixed;left:clamp(18px,3.2vw,54px);bottom:max(18px,env(safe-area-inset-bottom));z-index:40;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim2)}

/* ------------------------------------------------------------- index modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(4,6,10,.82);backdrop-filter:blur(10px);display:none;place-items:center;padding:4vw}
.modal.on{display:grid}
.mbox{position:relative;width:min(760px,94vw);max-height:88dvh;display:flex;flex-direction:column;background:linear-gradient(160deg,#121a1c,#0a0e10);
  border:1px solid var(--line);border-radius:var(--r);padding:clamp(14px,2vw,24px);overflow:hidden}
.mclose{position:absolute;top:10px;right:14px;font-size:26px;line-height:1;color:var(--dim);z-index:2}
.mbox h3{font-size:clamp(16px,2vw,24px);font-weight:700;letter-spacing:-.02em;margin-bottom:10px;padding-right:30px}
.mbox .search{flex:0 0 auto;height:42px;margin-bottom:12px}
#jlist{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin;display:grid;grid-template-columns:repeat(3,1fr);gap:3px 14px;align-content:start;padding-right:4px}
#jlist h5{grid-column:1/-1;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--acc);font-weight:700;margin:12px 0 4px;padding-top:10px;border-top:1px solid var(--line)}
#jlist h5:first-child{margin-top:0;border:0;padding-top:0}
.jrow{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:9px;text-align:left;min-width:0;transition:.15s;color:var(--dim)}
.jrow:hover{background:rgba(255,255,255,.06);color:var(--ink)}
.jrow.sel{background:rgba(217,173,78,.12);color:var(--ink)}
.jrow .jn{flex:0 0 26px;font-size:10.5px;color:var(--dim2);font-variant-numeric:tabular-nums;text-align:right}
.jrow i{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--c,var(--dim2))}
.jrow b{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jrow small{font-size:10.5px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto;padding-left:6px}
.mhint{margin-top:10px;font-size:10.5px;color:var(--dim2);letter-spacing:.06em}
.mhint kbd{font:inherit;padding:1px 6px;border:1px solid var(--line);border-radius:5px;color:var(--dim);margin:0 2px}
@media(max-width:640px){#jlist{grid-template-columns:1fr}}

/* ------------------------------------------------------------- reader */
.rbox{position:relative;width:min(840px,96vw);max-height:92dvh;display:flex;flex-direction:column;background:linear-gradient(170deg,#121a1c,#0a0e10);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rscroll{flex:1 1 auto;min-height:0;overflow-y:auto;scrollbar-width:thin;overscroll-behavior:contain}
.rbox .mclose{top:10px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);display:grid;place-items:center;font-size:22px;color:#fff}
.rnav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:38px;height:64px;display:grid;place-items:center;border-radius:12px;
  background:rgba(0,0,0,.45);border:1px solid var(--line);color:var(--dim);backdrop-filter:blur(8px);transition:.18s}
.rnav:hover{color:var(--acc);border-color:rgba(217,173,78,.5)}
.rnav.l{left:-50px}.rnav.r{right:-50px}
.rnav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rhero{position:relative;aspect-ratio:16/9;background:#0b0f11;overflow:hidden;border-bottom:1px solid var(--line)}
.rhero img{width:100%;height:100%;object-fit:cover;display:block}
.rhero.portrait img{object-fit:contain;background:#0b0f11}
.rhero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 70%,rgba(10,14,16,.9))}
.rhero .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(8px);display:grid;place-items:center}
.rhero .play::after{content:"";margin-left:5px;border-left:22px solid #fff;border-top:13px solid transparent;border-bottom:13px solid transparent}
.rhero .dur{position:absolute;right:14px;bottom:12px;z-index:2;padding:4px 9px;border-radius:7px;background:rgba(0,0,0,.65);font-size:12px;font-variant-numeric:tabular-nums}
.rhero .cap{position:absolute;left:16px;bottom:12px;z-index:2;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.rhero.gallery{aspect-ratio:auto;display:grid;grid-template-columns:3fr 2fr;grid-template-rows:1fr 1fr;gap:2px;background:#000}
.rhero.gallery img{min-height:0}
.rhero.gallery img:first-child{grid-row:1/3;aspect-ratio:4/3}
.rhero.gallery::after{display:none}
.rhero.quote{aspect-ratio:auto;padding:clamp(28px,5vw,56px) clamp(20px,4vw,48px);display:block;background:linear-gradient(150deg,color-mix(in srgb,var(--c) 70%,#000),#0b0f11)}
.rhero.quote::after{display:none}
.rhero.quote p{font-size:clamp(22px,3vw,38px);font-weight:700;letter-spacing:-.03em;line-height:1.15;position:relative;z-index:1}
.rhero.quote small{display:block;margin-top:14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.rart{padding:clamp(16px,2.6vw,30px) clamp(18px,3.4vw,44px) clamp(18px,3vw,34px);max-width:720px;margin:0 auto}
.rmeta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.rmeta .ava{width:30px;height:30px;font-size:10px}
.rmeta b{color:var(--ink);font-weight:700}
.rmeta .badge{padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.07);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.rmeta .badge.mission{color:var(--green)}
.rtitle{font-size:clamp(24px,3vw,40px);font-weight:700;letter-spacing:-.035em;line-height:1.08;margin:14px 0 10px}
.rlead{font-size:clamp(15px,1.3vw,18px);line-height:1.5;color:var(--dim);font-weight:300}
.rtags{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 4px}
.rtags .chip{cursor:pointer}
.rtext{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.rtext p{font-size:clamp(14.5px,1.15vw,16.5px);line-height:1.7;color:var(--ink);margin:0 0 16px;font-weight:300}
.rtext p:first-child::first-letter{font-size:2.6em;font-weight:700;float:left;line-height:.85;padding:4px 8px 0 0;color:var(--acc)}
.rfoot{display:flex;align-items:center;gap:6px;margin-top:8px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.rfoot button{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--dim);transition:.18s}
.rfoot button:hover{color:var(--ink);border-color:rgba(255,255,255,.3)}
.rfoot button.on{color:#ff8a82;border-color:rgba(255,138,130,.5)}
.rfoot svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rfoot button.on svg{fill:currentColor}
.rfoot .sp{margin-left:auto;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim2)}
.rmore{margin-top:22px}
.rmore .legend{margin-bottom:8px}
.rmore .row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:.18s;text-align:left;width:100%}
.rmore .row:hover{background:rgba(255,255,255,.04);border-color:var(--line)}
.rmore .row img{flex:0 0 72px;width:72px;height:48px;object-fit:cover;border-radius:8px}
.rmore .row b{display:block;font-size:13px;font-weight:700;line-height:1.25}
.rmore .row small{display:block;font-size:10.5px;color:var(--dim2);margin-top:2px}
.rcount{position:absolute;left:14px;top:14px;z-index:3;padding:4px 9px;border-radius:999px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);font-size:10.5px;letter-spacing:.1em;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------- additions: placements, language, captions, pages */
.placement{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 12px;border-radius:12px;border:1px solid rgba(217,173,78,.35);
  background:linear-gradient(90deg,rgba(217,173,78,.08),rgba(217,173,78,.02));font-size:clamp(9px,.82vw,11px);letter-spacing:.14em;text-transform:uppercase;color:var(--dim2);font-weight:700}
.placement .pl-logo{flex:0 0 auto;display:inline-grid;place-items:center;height:28px;padding:0 14px;border-radius:7px;background:var(--acc);color:#1a1206;font-style:normal;letter-spacing:.06em;font-size:12px}
.placement .pl-sched{margin-left:auto;font-weight:300;letter-spacing:.04em;text-transform:none;color:var(--dim)}
.placement .pl-sched b{color:var(--green);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:9px;margin-right:4px}
#tb-lang{margin-left:8px;border:1px solid var(--line)!important;color:var(--acc)!important;font-weight:700}
#tb-lang:hover{border-color:var(--acc)!important}
u.cc{text-decoration:none;display:inline-block;padding:0 4px;border:1px solid currentColor;border-radius:3px;font-size:8.5px;line-height:1.5;letter-spacing:.06em;vertical-align:1px;margin-left:2px}
.rhero.video{background:#000}
.rhero.video video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.rhero.video::after{display:none}
.rhero.video .cap{pointer-events:none;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:6px}
.mfoot{margin-top:8px;padding-top:10px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2)}
.mfoot button{color:var(--dim);letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.mfoot button:hover{color:var(--acc)}
.ev.core{border-color:rgba(217,173,78,.4)}
.ev .n{font-size:11px;white-space:nowrap}
.card[data-k="event"] .ev{grid-template-columns:auto minmax(0,1fr) auto}
.card[data-k="event"] .ev .n{font-size:10.5px;letter-spacing:.04em;min-width:44px}
button.ev{font:inherit;color:inherit;cursor:pointer;transition:.18s}
button.ev:hover{border-color:var(--acc)}
.ev .sw{margin-right:4px}
.ok .pill{color:var(--dim)}
@media(max-aspect-ratio:1/1){
  .placement .pl-sched{margin-left:0;flex:1 1 100%}
  #tb-lang{margin-left:4px;padding:5px 9px}
}

/* -------------------------------------------------------- portrait/mobile */
@media(max-aspect-ratio:1/1){
  #topbar{flex-wrap:wrap;row-gap:5px;padding:9px clamp(14px,4vw,22px) 10px;background:rgba(8,12,14,.92)}
  #topbar .tb-l{flex:1 1 100%;font-size:9.5px}
  #tb-tabs{margin-left:0}
  #tb-tabs button{padding:5px 11px;font-size:9.5px}
  #topbar .tb-r{display:none}
  .inner{flex-direction:column;overflow-y:auto;padding:clamp(14px,4vw,22px);padding-top:92px;padding-bottom:96px;gap:12px}
  /* the film stacks: a % flex-basis would now be a height, so every column sizes to its content */
  .col,.col.l,.col.r{flex:0 0 auto!important}
  .box.grow{overflow:visible;flex:0 0 auto}
  .box.lbbox{overflow:visible}
  h1.big{font-size:clamp(36px,12vw,60px)}
  .grid.c4,.grid.c5{grid-template-columns:repeat(2,1fr)}
  .grid.c3{grid-template-columns:repeat(3,1fr)}
  .roster{grid-template-columns:1fr}
  .vids{grid-template-columns:repeat(3,1fr)}
  .lbr{grid-template-columns:30px minmax(0,1fr) 50px 42px 50px 44px;font-size:13px;padding:8px 6px;gap:5px}
  .cityhero .code{font-size:clamp(64px,22vw,110px)}
  .form{grid-template-columns:1fr}
  .demo{display:none}
  .pphoto{flex:0 0 clamp(96px,28vw,130px)}
  .pinfo .nm{font-size:clamp(22px,7vw,32px)}
  /* stories: filter row scrolls sideways, the collage drops to two columns */
  .st-head{gap:8px}
  .search{flex:1 1 100%;height:42px}
  .filters{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px;padding-bottom:2px}
  .filters button{flex:0 0 auto;height:32px;padding:0 11px;font-size:11px;text-transform:uppercase}
  .filters button small{display:none}
  .st-count{display:none}
  /* the reader becomes a full-screen sheet */

 "TBA", "start": "2027-10-10", "end": "2027-10-15", "status": "upcoming"}], "rules": {"format": "team_best_ball", "best_balls": 2, "counting_rounds": 2, "points": [100, 80, 65, 55, 45, 38, 32, 27, 22, 18, 15], "tie_rule": "shared_average", "note": "Administrator-editable in the CMS: best balls counted per hole, points table, tie handling."}, "stories": [{"id": "d001", "status": "published", "kind": "article", "topic": "league", "at": "2027-01-29T14:20", "author": "Carlo De Marchis", "title": "October's best golfer had never won in 99 PGA Tour starts", "dek": "Austin Smotherman, 32, won his 100th at Black Desert on 4 October, 26 under and two clear. Three weeks later in Bermuda the wind cancelled the final round and he beat Seamus Power with a par on the third playoff hole. Two wins in a month, and a place at Pebble Beach next June.", "cities": [], "players": [], "likes": 0, "comments": 0, "size": "l", "photo": "img/people/austin-smotherman-october.jpg", "created_by": "Carlo", "created_at": "2026-11-04T23:59:08", "published_by": "Carlo", "published_at": "2026-11-04T23:59:13", "body": ["Ninety-nine starts without a win is a long apprenticeship, and until October Austin Smotherman's career on the PGA Tour read like one. Then came Black Desert on 4 October: 26 under par, two shots clear of the field, and a first title in the hundredth start.", "Three weeks later in Bermuda the weather did what Bermuda weather does. The final round was cancelled in the wind, the tournament went to a playoff, and Smotherman beat Seamus Power with a par on the third extra hole. Two wins in a month, from a player who had never had one.", "The second win carries a reward beyond the trophy: a place in the field at Pebble Beach next June. For a league built on second acts, it is a story worth telling to every athlete who thinks the best is behind them."], "updated_by": "Carlo", "updated_at": "2026-11-05T00:40:05"}, {"id": "d002", "status": "published", "kind": "article", "topic": "city", "at": "2027-01-29T14:20", "author": "Boston desk", "title": "Poulter leaves LIV at 50 for senior golf, YouTube and home", "dek": "He said it himself on 23 October: no LIV 2.0, less travel, some senior events and more of The Postman on YouTube. Seven Ryder Cups and four seasons as Majesticks co-captain go with him. Oosthuizen, Rahm, Garcia and Pieters had already left, with LIV in Chapter 11 since September.", "cities": ["bos"], "players": [], "likes": 0, "comments": 0, "size": "l", "photo": "img/people/ian-poulter-liv-exit.jpg", "created_by": "Carlo", "created_at": "2026-11-05T16:02:44", "published_by": "Carlo", "published_at": "2026-11-05T16:02:48"}, {"id": "s01", "kind": "result", "topic": "league", "at": "2027-01-29T13:55", "author": "Legacy League", "title": "Round 2 is live from El Camaleón", "dek": "Auto-published from the scoring feed: the board as it stands, updated with every hole.", "cities": [], "players": [], "photo": "img/course/R2026060.webp", "photos": [], "size": "r", "body": ["This board updates with every hole the scoring provider posts. A hole counts for a city only when all of its players have finished it; holes where two balls are in but team-mates are still on the course show as provisional in the detail view and never on the board.", "League points shown here are the points each city would receive at its current position. They are shared on ties and become final when the last group signs."], "title_es": "La Ronda 2 está en directo desde El Camaleón", "dek_es": "Publicado automáticamente desde el feed de resultados: la clasificación tal como está, actualizada hoyo a hoyo.", "body_es": ["Esta clasificación se actualiza con cada hoyo que publica el proveedor de resultados. Un hoyo cuenta para una ciudad solo cuando todos sus jugadores lo han terminado; los hoyos con dos bolas dentro pero compañeros aún en el campo aparecen como provisionales en el detalle y nunca en la clasificación.", "Los puntos de liga que se muestran son los que recibiría cada ciudad en su posición actual. Se reparten en caso de empate y son definitivos cuando firma el último grupo."]}, {"id": "s02", "kind": "video", "topic": "city", "at": "2027-01-29T12:10", "author": "Dallas desk", "title": "{p0}'s eagle on 13, from three angles", "dek": "The captain had not made an eagle since Del Mar. Then he hit a 5-wood to six feet.", "cities": ["dal"], "players": ["p1030"], "dur": "0:48", "likes": 2140, "comments": 96, "photo": "img/action/file-afa-charity-golf-tournament-7293217.jpg", "photos": [], "size": "l", "body": ["The 13th at El Camaleón is the par five everyone circles: 532 yards, reachable with a good drive, water left of the green. {p0} found the fairway, then hit a 5-wood that never left the flag and stopped six feet past.", "The putt went in dead centre and the team line for {c0} dropped two shots in one hole. It was the first eagle of the league season and, by the captain's own count, his first since the Del Mar exhibition."], "title_es": "El eagle de {p0} en el 13, desde tres ángulos", "dek_es": "El capitán no hacía un eagle desde Del Mar. Entonces pegó una madera 5 a dos metros.", "body_es": ["El 13 de El Camaleón es el par cinco que todos marcan: 532 yardas, alcanzable con un buen drive, agua a la izquierda del green. {p0} encontró la calle y pegó una madera 5 que nunca se separó de la bandera y se paró a dos metros.", "El putt entró por el centro y la línea de equipo de {c0} bajó dos golpes en un solo hoyo. Fue el primer eagle de la temporada de liga y, según el propio capitán, el primero desde la exhibición de Del Mar."]}, {"id": "s03", "kind": "article", "topic": "league", "at": "2027-01-29T09:30", "author": "Legacy League", "title": "Round 1 recap: Dallas lead a bunched field at −17", "dek": "Five cities inside four shots. Chicago's back nine of −9 was the round of the day; Miami lost two balls to the wind on 16 and never recovered.", "cities": ["dal", "chi", "mia"], "players": [], "likes": 980, "comments": 41, "photo": "img/course/R2026480.webp", "photos": [], "size": "xl", "body": ["Five cities finished round one inside four shots of each other, which is roughly what the format promised. Dallas led after a steady day in which seven players contributed at least one counted ball, and nobody posted worse than a bogey on a counted hole.", "Chicago were the movers. A back nine of nine under, built on three birdies in a row from the 14th, took them from the middle of the board to second. Miami's two lost balls on 16, both to the same gust, cost them a counted double and the chance of a top-five start."], "title_es": "Resumen de la Ronda 1: Dallas lidera un pelotón apretado con −17", "dek_es": "Cinco ciudades en cuatro golpes. Los −9 de Chicago en la segunda vuelta fueron la vuelta del día; Miami perdió dos bolas con el viento en el 16 y no se recuperó.", "body_es": ["Cinco ciudades terminaron la primera ronda a menos de cuatro golpes entre sí, que es más o menos lo que prometía el formato. Dallas lideró tras un día sólido en el que siete jugadores aportaron al menos una bola contada y nadie firmó peor que bogey en un hoyo contado.", "Chicago fue el equipo que más se movió. Una segunda vuelta de nueve bajo par, construida sobre tres birdies seguidos desde el 14, los llevó de la mitad de la tabla al segundo puesto. Las dos bolas que Miami perdió en el 16, ambas con la misma racha de viento, les costaron un doble contado y la opción de empezar entre los cinco primeros."]}, {"id": "s04", "kind": "gallery", "topic": "city", "at": "2027-01-28T21:05", "author": "Legacy League", "title": "Celebrity-Am at Mayakoba: 24 pictures", "dek": "The night before it counts. Pairings dinner on the beach, the Am draw, and a very long putt from a very famous comedian.", "cities": ["lax", "nyc", "mia"], "players": ["p1028", "p1061"], "count": 24, "likes": 3310, "comments": 128, "photo": "img/course/R2026026.webp", "photos": ["img/course/R2026026.webp", "img/course/R2026041.webp", "img/action/file-afa-charity-golf-tournament-7293244.jpg"], "size": "m", "body": ["The Celebrity-Am is the one day of the week with no points on the line and the only one where the crowd is allowed inside the ropes. Twenty-four pictures from an evening that started with the pairings draw on the beach and ended with a very long putt from a very famous comedian.", "Every picture in this gallery is tagged by city and player, so it also appears on the hubs and the player cards of everyone in it."], "title_es": "Celebrity-Am en Mayakoba: 24 fotos", "dek_es": "La noche antes de que cuente. Cena de emparejamientos en la playa, el sorteo del Am y un putt muy largo de un humorista muy famoso.", "body_es": ["El Celebrity-Am es el único día de la semana sin puntos en juego y el único en que el público puede entrar dentro de las cuerdas. Veinticuatro fotos de una velada que empezó con el sorteo de emparejamientos en la playa y terminó con un putt muy largo de un humorista muy famoso.", "Cada foto de esta galería está etiquetada por ciudad y jugador, así que aparece también en los hubs y en las fichas de todos los que salen en ella."]}, {"id": "s05", "kind": "quote", "topic": "mission", "at": "2027-01-28T17:40", "author": "Legacy League · Mission", "title": "“The locker room was the loudest place I have ever been. Retirement was the quietest.”", "dek": "Episode 1 of Second Half, the league's series on athletes and mental health, is out now.", "cities": ["phi"], "players": ["p1038"], "likes": 5120, "comments": 402, "photo": "img/course/R2026021.webp", "photos": [], "size": "m", "body": ["Second Half is the league's series on what happens to athletes after the last game. Episode one follows {p0} through the two years after retirement, the silence after the locker room and the morning he first asked for help.", "The series is produced by the league and will stay free to watch. If any of this is close to home, the 988 Suicide & Crisis Lifeline answers calls and texts in the United States at any hour."], "title_es": "«El vestuario era el lugar más ruidoso en el que he estado. La retirada fue el más silencioso.»", "dek_es": "Ya está disponible el episodio 1 de Second Half, la serie de la liga sobre deportistas y salud mental.", "body_es": ["Second Half es la serie de la liga sobre lo que les pasa a los deportistas después del último partido. El primer episodio sigue a {p0} durante los dos años posteriores a su retirada, el silencio tras el vestuario y la mañana en que pidió ayuda por primera vez.", "La serie la produce la liga y seguirá siendo gratuita. Si algo de esto te toca de cerca, la línea 988 Suicide & Crisis Lifeline atiende llamadas y mensajes en Estados Unidos a cualquier hora."]}, {"id": "s06", "kind": "video", "topic": "mission", "at": "2027-01-28T17:30", "author": "Legacy League · Mission", "title": "Second Half · Episode 1", "dek": "Twenty-two minutes with the Philadelphia captain on the two years after the last game.", "cities": ["phi"], "players": ["p1037"], "dur": "22:14", "likes": 4410, "comments": 310, "photo": "img/action/file-golf-bunker-shot-2-jpg.jpg", "photos": [], "size": "l", "body": ["Twenty-two minutes with the {c0} captain, filmed over three days at home and on the range. He talks about the schedule that disappeared, the identity that went with it, and the friend who made him pick up a golf club again.", "Watch with captions in English and Spanish. The next episode follows a player from another city and will be published after the next event."], "title_es": "Second Half · Episodio 1", "dek_es": "Veintidós minutos con el capitán de Filadelfia sobre los dos años posteriores al último partido.", "body_es": ["Veintidós minutos con el capitán de {c0}, grabados durante tres días en su casa y en el campo de prácticas. Habla del calendario que desapareció, de la identidad que se fue con él y del amigo que le hizo volver a coger un palo de golf.", "Disponible con subtítulos en inglés y español. El siguiente episodio sigue a un jugador de otra ciudad y se publicará tras el próximo evento."]}, {"id": "s07", "kind": "video", "topic": "city", "at": "2027-01-28T15:00", "author": "Chicago desk", "title": "Chicago's back nine, hole by hole", "dek": "Nine holes, nine under. Every counted ball and who made it.", "cities": ["chi"], "players": ["p1001", "p1003"], "dur": "3:02", "likes": 1760, "comments": 73, "photo": "img/action/file-bunker-shot-geograph-org-uk-4867695.jpg", "photos": [], "size": "l", "body": ["Nine holes, nine under. This cut shows every counted ball on Chicago's back nine on Thursday: who hit it, from where, and which of the two scores it replaced on the team card.", "The run started with three birdies in a row from the 14th and ended with the captain's long two-putt on 18 that kept the par and the position."], "title_es": "La segunda vuelta de Chicago, hoyo a hoyo", "dek_es": "Nueve hoyos, nueve bajo par. Cada bola contada y quién la hizo.", "body_es": ["Nueve hoyos, nueve bajo par. Este montaje muestra cada bola contada de la segunda vuelta de Chicago el jueves: quién la pegó, desde dónde y a cuál de los dos resultados sustituyó en la tarjeta del equipo.", "La racha empezó con tres birdies seguidos desde el 14 y terminó con el largo dos putts del capitán en el 18 que salvó el par y la posición."]}, {"id": "s08", "kind": "article", "topic": "league", "at": "2027-01-28T07:00", "author": "Legacy League", "title": "Pairings and tee times for Round 1", "dek": "Groups of three, one city each, off the first tee from 08:00 local. Follow your city to get your times pushed.", "cities": [], "players": [], "likes": 620, "comments": 18, "photo": "img/action/file-afa-charity-golf-tournament-7293245.jpg", "photos": [], "size": "s", "body": ["Groups of three, one player from each city, off the first tee from 08:00 local time at eleven-minute intervals. Captains were drawn into the first seven groups so that every city has a counted score on the board early.", "Follow your city and tee times will be pushed to you the evening before each round, together with the round leaders and the final result."], "title_es": "Emparejamientos y horarios de salida de la Ronda 1", "dek_es": "Grupos de tres, una ciudad cada uno, desde el tee del 1 a partir de las 08:00 hora local. Sigue a tu ciudad para recibir tus horarios.", "body_es": ["Grupos de tres, un jugador de cada ciudad, desde el tee del 1 a partir de las 08:00 hora local, con intervalos de once minutos. Los capitanes se sortearon en los siete primeros grupos para que cada ciudad tenga pronto un resultado contado en la clasificación.", "Sigue a tu ciudad y recibirás los horarios de salida la víspera de cada ronda, junto con los líderes de la ronda y el resultado final."]}, {"id": "s09", "kind": "gallery", "topic": "city", "at": "2027-01-27T20:30", "author": "Boston desk", "title": "Boston arrive: the welcome at Mayakoba", "dek": "Eight players, one green jacket that is definitely not that green jacket.", "cities": ["bos"], "players": ["p1009", "p1010"], "count": 12, "likes": 1420, "comments": 55, "photo": "img/course/R2026475.webp", "photos": ["img/course/R2026475.webp", "img/course/R2026013.webp", "img/course/R2026004.webp"], "size": "m", "body": ["Boston arrived on Tuesday evening with eight players and a kit bag that produced a green jacket of uncertain provenance. The welcome at the resort included a mariachi version of a song the Celtics crowd would recognise.", "Twelve pictures from the arrival evening and the first practice round."], "title_es": "Boston llega: la bienvenida en Mayakoba", "dek_es": "Ocho jugadores y una chaqueta verde que definitivamente no es esa chaqueta verde.", "body_es": ["Boston llegó el martes por la noche con ocho jugadores y una bolsa de la que salió una chaqueta verde de procedencia incierta. La bienvenida en el resort incluyó una versión mariachi de una canción que la afición de los Celtics reconocería.", "Doce fotos de la noche de llegada y de la primera vuelta de prácticas."]}, {"id": "s10", "kind": "video", "topic": "city", "at": "2027-01-27T16:00", "author": "Legacy League", "title": "City documentary: New York, trailer", "dek": "Six boroughs, five franchises, one team. The first of eleven city films, coming through the season.", "cities": ["nyc"], "players": [], "dur": "1:30", "likes": 2980, "comments": 140, "photo": "img/course/R2026020.webp", "photos": [], "size": "l", "body": ["The first of eleven city films, one per market, each telling the story of a city through the athletes who played for it and the charity its team supports. New York goes first because New York insisted.", "The full film premieres on this platform in March. The trailer is ninety seconds and ends on a shot of the 7 train."], "title_es": "Documental de ciudad: Nueva York, tráiler", "dek_es": "Seis distritos, cinco franquicias, un equipo. La primera de once películas de ciudad, a lo largo de la temporada.", "body_es": ["La primera de once películas de ciudad, una por mercado, cada una contando la historia de una ciudad a través de los deportistas que jugaron por ella y de la organización benéfica a la que apoya su equipo. Nueva York va primero porque Nueva York insistió.", "La película completa se estrena en esta plataforma en marzo. El tráiler dura noventa segundos y termina con un plano del tren 7."]}, {"id": "s11", "kind": "article", "topic": "league", "at": "2027-01-26T18:00", "author": "Legacy League", "title": "How team best ball works, in ninety seconds", "dek": "Two balls count on every hole. Ties share the points. The rulebook, explained by the people who have to live with it.", "cities": [], "players": [], "likes": 870, "comments": 64, "photo": "img/course/R2026030.webp", "photos": [], "size": "s", "body": ["Every city fields six to eight players. On each hole, the best two scores among them count toward the team total; the others are discarded. Two rounds make an event, and the event finishing positions convert to league points on a fixed table.", "Ties share the points on offer. The season champion is the city with the most points after five events; the Team Championship in October is played for a separate purse."], "title_es": "Cómo funciona el team best ball, en noventa segundos", "dek_es": "En cada hoyo cuentan dos bolas. Los empates reparten los puntos. El reglamento, explicado por quienes tienen que vivir con él.", "body_es": ["Cada ciudad alinea entre seis y ocho jugadores. En cada hoyo cuentan los dos mejores resultados del equipo; los demás se descartan. Dos rondas hacen un evento, y las posiciones finales del evento se convierten en puntos de liga según una tabla fija.", "Los empates reparten los puntos en juego. El campeón de la temporada es la ciudad con más puntos tras cinco eventos; el Campeonato por Equipos de octubre se juega por una bolsa de premios aparte."]}, {"id": "s12", "kind": "video", "topic": "city", "at": "2027-01-26T12:00", "author": "Los Angeles desk", "title": "Captain's round · Episode 1", "dek": "A practice round at El Camaleón with the LA captain and a microphone. Language mostly clean.", "cities": ["lax"], "players": ["p1023"], "dur": "11:40", "likes": 1230, "comments": 47, "photo": "img/action/file-golf-bunker-shot-1-jpg.jpg", "photos": [], "size": "l", "body": ["A practice round with the {c0} captain and a microphone, filmed the day before the Celebrity-Am. He explains how he picks his playing order, why the par threes at El Camaleón scare him more than the par fives, and what he says to a team-mate who has just made a double.", "Language mostly clean. Episode two is filmed at the next event."], "title_es": "La vuelta del capitán · Episodio 1", "dek_es": "Una vuelta de prácticas en El Camaleón con el capitán de LA y un micrófono. Lenguaje casi siempre limpio.", "body_es": ["Una vuelta de prácticas con el capitán de {c0} y un micrófono, grabada el día antes del Celebrity-Am. Explica cómo elige el orden de juego, por qué los pares tres de El Camaleón le asustan más que los pares cinco y qué le dice a un compañero que acaba de hacer un doble bogey.", "Lenguaje casi siempre limpio. El segundo episodio se graba en el próximo evento."]}, {"id": "s13", "kind": "quote", "topic": "city", "at": "2027-01-25T19:20", "author": "Detroit desk", "title": "“I played fourteen years in that city. I owe it a few birdies.”", "dek": "Detroit's captain on why he said yes.", "cities": ["det"], "players": ["p1044"], "likes": 2210, "comments": 88, "photo": "img/course/R2026018.webp", "photos": [], "size": "m", "body": ["{p0} played fourteen seasons in Detroit and never considered playing for anyone else, in any sport. Asked why he said yes to a golf league, the answer took four seconds.", "The full interview runs on the Detroit hub, together with the roster and the city's charity partner."], "title_es": "«Jugué catorce años en esa ciudad. Le debo unos cuantos birdies.»", "dek_es": "El capitán de Detroit explica por qué dijo que sí.", "body_es": ["{p0} jugó catorce temporadas en Detroit y nunca se planteó jugar para nadie más, en ningún deporte. Preguntado por qué dijo que sí a una liga de golf, la respuesta tardó cuatro segundos.", "La entrevista completa está en el hub de Detroit, junto con la plantilla y la organización benéfica de la ciudad."]}, {"id": "s14", "kind": "gallery", "topic": "league", "at": "2027-01-25T15:00", "author": "Legacy League", "title": "The course: El Camaleón in 18 frames", "dek": "Mangroves, cenotes and a par 3 over the beach. Hole by hole, before anyone had made a bogey on it.", "cities": [], "players": [], "count": 18, "likes": 1980, "comments": 36, "photo": "img/action/file-morgan-pressel-flickr-keith-allison.jpg", "photos": ["img/action/file-morgan-pressel-flickr-keith-allison.jpg", "img/course/R2026009.webp", "img/action/file-golf-player-putting-green-2003-jpg.jpg"], "size": "m", "body": ["Eighteen frames, one per hole, taken on Monday before the first practice ball. Mangroves on the front nine, a cenote beside the seventh fairway, and the fifteenth, a par three played over the beach with the wind doing whatever it likes.", "Yardages shown are from the tournament tees used this week: 7,034 yards, par 71."], "title_es": "El campo: El Camaleón en 18 imágenes", "dek_es": "Manglares, cenotes y un par 3 sobre la playa. Hoyo a hoyo, antes de que nadie hiciera un bogey en él.", "body_es": ["Dieciocho imágenes, una por hoyo, tomadas el lunes antes de la primera bola de prácticas. Manglares en la primera vuelta, un cenote junto a la calle del siete y el quince, un par tres que se juega sobre la playa con el viento haciendo lo que le apetece.", "Las distancias indicadas son desde los tees de torneo de esta semana: 7.034 yardas, par 71."]}, {"id": "s15", "kind": "article", "topic": "mission", "at": "2027-01-24T10:00", "author": "Legacy League · Mission", "title": "Every point scored this week funds a city charity", "dek": "Eleven partners, one per city, named by the players. Here is who they are and what the money does.", "cities": [], "players": [], "likes": 1540, "comments": 52, "photo": "img/action/file-masters-tournament-2015-rory-mcilro.jpg", "photos": [], "size": "m", "body": ["Each city's team plays for one charity, named by the players, working on mental health in that city. A fixed share of the league points a team scores converts into funding at the end of the season, and every event adds a city-specific grant on top.", "The eleven partners are listed on the Mission page with what the money does. Donations from fans open later in the season."], "title_es": "Cada punto sumado esta semana financia una organización de su ciudad", "dek_es": "Once socios, uno por ciudad, elegidos por los jugadores. Quiénes son y a qué se destina el dinero.", "body_es": ["El equipo de cada ciudad juega por una organización, elegida por los jugadores, que trabaja en salud mental en esa ciudad. Una parte fija de los puntos de liga que suma un equipo se convierte en financiación al final de la temporada, y cada evento añade además una ayuda específica para la ciudad.", "Los once socios aparecen en la página de la Misión con el detalle de a qué se destina el dinero. Las donaciones de los aficionados se abrirán más adelante en la temporada."]}, {"id": "s16", "kind": "video", "topic": "league", "at": "2026-11-16T20:00", "author": "Legacy League", "title": "Del Mar highlights: the exhibition that started it", "dek": "Eight minutes from November's test event in San Diego, where the format was tried and the cities were announced.", "cities": [], "players": [], "dur": "8:12", "likes": 6400, "comments": 510, "video": "img/video/swing.webm", "captions": ["en", "es"], "credit": "Clip: Nesnad, Wikimedia Commons, CC BY 4.0", "photo": "img/course/R2026011.webp", "photos": [], "size": "l", "body": ["Del Mar in November was the dress rehearsal: two rounds, eleven cities, the format tested in front of a real crowd for the first time. The eight minutes here cover the shots that mattered and the moment the cities were announced.", "Everything learned at Del Mar, from the pace of play to how scores reach this app, went into the way Mayakoba is run."], "title_es": "Lo mejor de Del Mar: la exhibición con la que empezó todo", "dek_es": "Ocho minutos del evento de prueba de noviembre en San Diego, donde se probó el formato y se anunciaron las ciudades.", "body_es": ["Del Mar, en noviembre, fue el ensayo general: dos rondas, once ciudades, el formato probado por primera vez ante público real. Los ocho minutos de este vídeo recogen los golpes que importaron y el momento en que se anunciaron las ciudades.", "Todo lo aprendido en Del Mar, desde el ritmo de juego hasta cómo llegan los resultados a esta app, se ha aplicado a la organización de Mayakoba."]}, {"id": "s17", "kind": "video", "topic": "city", "at": "2026-11-16T18:00", "author": "San Francisco desk", "title": "San Francisco at Del Mar", "dek": "The 49ers legend who had never played in front of a crowd. Until the 18th.", "cities": ["sfo"], "players": ["p1051"], "dur": "2:40", "likes": 1870, "comments": 71, "photo": "img/course/R2026007.webp", "photos": [], "size": "l", "body": ["{p0} had played a lot of golf, none of it in front of people. The 18th at Del Mar fixed that: a crowd three deep around the green and a chip that stopped a foot from the hole.", "The clip, and his reaction, became the most shared piece of the exhibition."], "title_es": "San Francisco en Del Mar", "dek_es": "La leyenda de los 49ers que nunca había jugado ante público. Hasta el 18.", "body_es": ["{p0} había jugado mucho al golf, pero nunca delante de gente. El 18 de Del Mar lo arregló: un público de tres filas alrededor del green y un chip que se paró a treinta centímetros del hoyo.", "El clip, y su reacción, se convirtió en la pieza más compartida de la exhibición."]}, {"id": "s18", "kind": "gallery", "topic": "city", "at": "2026-11-15T22:00", "author": "Miami desk", "title": "Miami's roster, announced", "dek": "Dolphins, Heat and Marlins. Seven players, one broadcaster, zero handicaps under five.", "cities": ["mia"], "players": ["p1058", "p1059", "p1060"], "count": 9, "likes": 1120, "comments": 39, "photo": "img/action/file-dsc-6915-a-golfer-in-a-straw-hat-an.jpg", "photos": ["img/action/file-dsc-6915-a-golfer-in-a-straw-hat-an.jpg", "img/course/R2026012.webp", "img/course/R2026034.webp"], "size": "m", "body": ["Dolphins, Heat and Marlins. Seven players and one broadcaster who insists he is the best putter on the team. Miami's roster was the last of the eleven to be announced and the first to sell out its Celebrity-Am places.", "Nine portraits from the announcement day, tagged to each player's card."], "title_es": "La plantilla de Miami, anunciada", "dek_es": "Dolphins, Heat y Marlins. Siete jugadores, un presentador, ningún hándicap por debajo de cinco.", "body_es": ["Dolphins, Heat y Marlins. Siete jugadores y un presentador que insiste en que es el mejor pateador del equipo. La plantilla de Miami fue la última de las once en anunciarse y la primera en agotar sus plazas del Celebrity-Am.", "Nueve retratos del día del anuncio, etiquetados a la ficha de cada jugador."]}], "hero": ["img/course/R2026011.webp", "img/course/R2026007.webp", "img/action/file-dsc-6915-a-golfer-in-a-straw-hat-an.jpg", "img/course/R2026012.webp"], "resources": [{"name": "988 Suicide & Crisis Lifeline", "detail": "Call or text 988 (US)", "url": "https://988lifeline.org"}]};

const t = s => LANG === "es" ? (T[s] ?? s) : s;

const CITY = Object.fromEntries(LEAGUE.cities.map(c => [c.id, c]));
const PLAYER = Object.fromEntries(LEAGUE.players.map(p => [p.id, p]));
const PAR = FEED.event.course.holes.map(h => h.par);
const RULES = LEAGUE.rules;
const EVENT = LEAGUE.schedule[0];
const LB_SPONSOR = LEAGUE.league.leaderboard_sponsor || "Sponsor";
const TEE = {};          // player id -> {r1: minutes, r2: minutes}
FEED.tee_sheet.forEach(g => { const [h, m] = g.tee_time.slice(11, 16).split(":").map(Number);
  g.players.forEach(p => { (TEE[p.id] ||= {})[g.round_id] = h * 60 + m; }); });
const SCORE = {};        // round -> player -> holes[]
FEED.scores.forEach(s => ((SCORE[s.round_id] ||= {})[s.player_id] = s.hole_scores));
const [h0, m0] = FEED.sim.clock_start.slice(11, 16).split(":").map(Number);
const state = {
  clock: h0 * 60 + m0,       // the simulated wall clock, minutes
  feedClock: h0 * 60 + m0,   // the last time the feed answered
  stale: false, playing: false,
  round: PREF.get("round", "r2"),
  sel: PREF.get("sel", null),
  follow: new Set(PREF.get("follow", [])),
};
const fmt = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
const sgn = n => n === 0 ? "E" : n > 0 ? `+${n}` : `${n}`;
const cls = n => n === 0 ? "e" : n > 0 ? "o" : "u";
const ord = n => LANG === "es" ? `${n}º` : n + (["th", "st", "nd", "rd"][(n % 100 > 10 && n % 100 < 14) ? 0 : n % 10 < 4 ? n % 10 : 0]);
const ini = n => n.split(" ").map(w => w[0]).join("").slice(0, 2);
const lastName = n => n.split(" ").slice(-1)[0];

/* ----------------------------------------------------------- scoring */
/* The feed gives raw hole scores per player; everything the brief lists
   (team best ball, ties, provisional vs final, league points, standings)
   is computed here, so a change of provider changes only the adapter. */
function posted(rid, pid, h) {
  if (rid === "r1") return true;
  const tee = TEE[pid] && TEE[pid][rid]; if (tee == null) return false;
  return tee + (h + 1) * FEED.sim.minutes_per_hole <= state.feedClock;
}
function playerHoles(rid, pid) {
  return SCORE[rid][pid].map((s, h) => posted(rid, pid, h) ? s : null);
}
function teamRound(cid, rid) {
  const ids = LEAGUE.players.filter(p => p.city === cid).map(p => p.id);
  const rows = ids.map(pid => ({ pid, holes: playerHoles(rid, pid) }));
  const holes = PAR.map((par, h) => {
    const got = rows.map(r => ({ pid: r.pid, s: r.holes[h] })).filter(x => x.s != null).sort((a, b) => a.s - b.s);
    if (got.length < RULES.best_balls) return { status: "none", counted: [], score: null, par };
    const counted = got.slice(0, RULES.best_balls);
    return { status: got.length === rows.length ? "firm" : "prov", counted: counted.map(x => x.pid),
             score: counted.reduce((a, x) => a + x.s, 0), par: par * RULES.best_balls };
  });
  // The board counts a hole only once the whole team has posted it ("firm").
  // Holes where two balls are in but team-mates are still on the course stay
  // provisional: shown dimmed in the detail grid, never on the leaderboard.
  const toPar = holes.reduce((a, x) => a + (x.status === "firm" ? x.score - x.par : 0), 0);
  const thru = holes.filter(x => x.status === "firm").length;
  const firm = thru === 18;
  const started = holes.some(x => x.status !== "none");
  return { rows, holes, toPar, thru, firm, started };
}
function leaderboard() {
  const list = LEAGUE.cities.map(c => {
    const r1 = teamRound(c.id, "r1"), r2 = teamRound(c.id, "r2");
    return { c, r1, r2, total: r1.toPar + r2.toPar, today: r2.toPar, thru: r2.thru, final: r1.firm && r2.firm };
  }).sort((a, b) => a.total - b.total || a.c.name.localeCompare(b.c.name));
  // tied positions: shared place, averaged points (RULES.tie_rule)
  let i = 0;
  while (i < list.length) {
    let j = i; while (j + 1 < list.length && list[j + 1].total === list[i].total) j++;
    const pts = RULES.points.slice(i, j + 1).reduce((a, b) => a + b, 0) / (j - i + 1);
    for (let k = i; k <= j; k++) { list[k].pos = i + 1; list[k].tied = j > i; list[k].pts = Math.round(pts * 10) / 10; }
    i = j + 1;
  }
  return list;
}
const allFinal = lb => lb.every(x => x.final);

/* ------------------------------------------------------------ cards */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sq = (s, par, extra = "") => {
  if (s == null) return `<div><span class="sq none ${extra}">·</span></div>`;
  const d = s - par, k = d <= -2 ? "eagle" : d === -1 ? "birdie" : d === 0 ? "par" : d === 1 ? "bogey" : "dbl";
  return `<div><span class="sq ${k} ${extra}">${s}</span></div>`;
};
function holeGrid(rows, team, label) {
  // rows: [{label, holes[], pid}] ; team: result of teamRound (optional)
  const head = `<div class="lab">${label || t("Hole")}</div>` + PAR.map((_, h) => h === 9 ? `<div class="hn sub">${t("Out")}</div><div class="hn">10</div>` : `<div class="hn">${h + 1}</div>`).join("") + `<div class="hn sub">${t("In")}</div><div class="hn sub">${t("Tot")}</div>`;
  const parRow = `<div class="lab"><small>${t("Par")}</small></div>` + PAR.map((p, h) => (h === 9 ? `<div class="pr sub">${PAR.slice(0, 9).reduce((a, b) => a + b)}</div>` : "") + `<div class="pr">${p}</div>`).join("") + `<div class="pr sub">${PAR.slice(9).reduce((a, b) => a + b)}</div><div class="pr sub">${PAR.reduce((a, b) => a + b)}</div>`;
  const sum = (arr, a, b) => arr.slice(a, b).every(x => x != null) ? arr.slice(a, b).reduce((x, y) => x + y, 0) : null;
  const tp = (arr, a, b) => { const s = sum(arr, a, b); if (s == null) return `<div class="sub">·</div>`; return `<div class="sub">${s}</div>`; };
  const body = rows.map(r => {
    const cells = r.holes.map((s, h) => (h === 9 ? tp(r.holes, 0, 9) : "") +
      sq(s, PAR[h], team && team.holes[h].counted.includes(r.pid) ? "cnt" : "")).join("");
    const done = r.holes.filter(x => x != null).length;
    const toPar = r.holes.reduce((a, s, h) => s == null ? a : a + s - PAR[h], 0);
    const tot = done ? `<div class="tot ${cls(toPar)}">${sgn(toPar)}</div>` : `<div class="tot">·</div>`;
    return `<div class="lab"><b>${esc(r.label)}</b>${r.sub ? `<small>${r.sub}</small>` : ""}</div>${cells}${tp(r.holes, 9, 18)}${tot}`;
  }).join("");
  let teamRow = "";
  if (team) {
    const nine = (a, b) => team.holes.slice(a, b).every(y => y.status === "firm") ? sgn(team.holes.slice(a, b).reduce((s, y) => s + y.score - y.par, 0)) : "·";
    const cells = team.holes.map((x, h) => {
      const tt = x.score == null ? `<div><span class="sq none">·</span></div>` :
        `<div><span class="sq team ${cls(x.score - x.par)} ${x.status === "prov" ? "prov" : ""}" title="${x.status === "prov" ? t("Provisional: team-mates still on this hole") : ""}">${sgn(x.score - x.par)}</span></div>`;
      return (h === 9 ? `<div class="sub">${nine(0, 9)}</div>` : "") + tt;
    }).join("");
    teamRow = `<div class="lab trow"><b>${t("Team")}</b><small>${t("best")} ${RULES.best_balls}</small></div>${cells}<div class="sub">${nine(9, 18)}</div><div class="tot ${cls(team.toPar)}">${team.thru ? sgn(team.toPar) : "·"}</div>`;
  }
  return `<div class="scwrap"><div class="scg">${head}${parRow}${body}${teamRow}</div></div>`;
}
const LEGEND_P = () => `<div class="sclegend"><span><i class="sq eagle" style="width:14px;height:14px"></i>${t("Eagle")}</span><span><i class="sq birdie" style="width:14px;height:14px"></i>${t("Birdie")}</span><span><i class="sq bogey" style="width:14px;height:14px"></i>${t("Bogey")}</span><span><i class="sq dbl" style="width:14px;height:14px"></i>${t("Double+")}</span><span><i class="sq cnt" style="width:14px;height:14px"></i>${t("Counted for the team")}</span>`;

const norm = x => String(x).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");

    ...(s.players || []).map(p => PLAYER[p] ? PLAYER[p].name : "")].join(" "));

const film = document.getElementById("film");
const lb0 = leaderboard();
const cityOrder = lb0.map(x => x.c);
const playerOrder = cityOrder.flatMap(c => LEAGUE.players.filter(p => p.city === c.id).sort((a, b) => b.captain - a.captain || a.handicap - b.handicap));
const CARDS = [{ k: "story" }, { k: "live" }, { k: "stories" }, ...cityOrder.map(c => ({ k: "city", id: c.id })),
               ...playerOrder.map(p => ({ k: "player", id: p.id })), { k: "season" }, { k: "event" }, { k: "capture" }, { k: "mission" }];
const SEC = { live: 1, stories: 2, cities: 3, players: 3 + cityOrder.length, season: CARDS.length - 4, event: CARDS.length - 3, capture: CARDS.length - 2, mission: CARDS.length - 1 };
film.innerHTML = storyCard() + liveCard() + storiesCard() + cityOrder.map((c, i) => cityCard(c, i)).join("") +
  playerOrder.map((p, i) => playerCard(p, i + 1)).join("") + seasonCard() + eventCard() + captureCard() + missionCard();
const total = CARDS.length;
let cur = 0, lastPos = {}, lastLeader = null, finalSeen = false;

function lbRows(lb, compact) {
  const final = allFinal(lb);
  return `<div class="lbr h"><span class="pos">${t("Pos")}</span><span class="nm">${t("City")}</span><span>${t("Today")}</span><span>${t("Thru")}</span><span>${t("Total")}</span><span>${t("Pts")}</span></div>` +
    lb.map(x => `<div class="lbr ${x.c.id === state.sel ? "sel" : ""} ${state.follow.has(x.c.id) ? "fol" : ""}" onclick="selectCity('${x.c.id}')">
      <span class="pos">${x.tied ? "T" : ""}${x.pos}</span>
      <span class="nm"><i class="sw" style="--c:${x.c.color}"></i>${compact ? x.c.short : esc(x.c.name)}${compact ? "" : ` <em>${x.c.short}</em>`}</span>
      <span class="${x.r2.thru ? cls(x.today) : "e"}">${x.r2.thru ? sgn(x.today) : "–"}</span>
      <span class="thru">${!x.r2.started ? fmtTee(x.c.id) : x.thru === 18 ? "F" : x.thru || "·"}</span>
