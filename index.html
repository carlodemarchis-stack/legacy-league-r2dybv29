  const k = CARDS[cur].k, liveEv = cur === SEC.live;
  const sec = liveEv ? "live" : k === "stories" ? "stories" : k === "city" ? "cities" : k === "player" ? "players" : ["season", "event"].includes(k) ? "season" : ["capture", "mission"].includes(k) ? "league" : "home";
  document.querySelectorAll("#tb-tabs button[data-sec]").forEach(b => b.classList.toggle("on", b.dataset.sec === sec));
  document.getElementById("tb-ctx").textContent = k === "story" ? t("· 2027 season") : liveEv ? t("· Mayakoba · live") : k === "stories" ? t("· Stories") :
    k === "city" ? `· ${t("City hubs")} · ${cur - SEC.cities + 1} / ${cityOrder.length}` : k === "player" ? `· ${t("Players")} · ${cur - SEC.players + 1} / ${playerOrder.length}` :
    k === "event" ? `· ${t("Season")} · ${L(LEAGUE.schedule.find(e => e.id === CARDS[cur].id), "name")}` : k === "season" ? t("· Season") : `· ${t("League")}`;
  location.hash = cur ? "#" + (cur + 1) : "";
  film.children[cur === SEC.live ? HOME : cur].querySelector(".inner").scrollTop = 0;
}
const next = () => go(cur + 1 >= total ? 0 : cur + 1), prev = () => go(cur - 1);
/* The double arrows move a section at a time: start, live, stories, cities, players, season, league.
   Back goes to the start of the current section first, then to the one before it. */
const STOPS = [0, SEC.live, SEC.stories, SEC.cities, SEC.players, SEC.season, SEC.league];
const nextSec = () => go(STOPS.find(n => n > cur) ?? 0), prevSec = () => go([...STOPS].reverse().find(n => n < cur) ?? 0);
document.getElementById("b-next").onclick = next;
document.getElementById("b-prev").onclick = prev;
document.getElementById("b-nsec").onclick = nextSec;
document.getElementById("b-psec").onclick = prevSec;
document.getElementById("b-first").onclick = () => go(0);
document.getElementById("count").onclick = openJump;
/* Theme: dark is the design, light is the alternative. The icon in the bar switches between the two. */
function applyTheme() {
  const light = PREF.get("theme", "dark") === "light";
  if (light) document.documentElement.dataset.theme = "light"; else delete document.documentElement.dataset.theme;
  document.querySelector('meta[name="theme-color"]').content = light ? "#e7ecea" : "#080c0e";
}
document.getElementById("b-theme").onclick = () => { PREF.set("theme", PREF.get("theme", "dark") === "light" ? "dark" : "light"); applyTheme(); };
applyTheme();
document.getElementById("b-full").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
document.querySelectorAll("#tb-tabs button[data-sec]").forEach(b => { b.onclick = () => go(SEC[b.dataset.sec]); });
// static chrome strings
document.querySelectorAll("[data-t]").forEach(el => { const k = el.dataset.t; if (el.hasAttribute("title")) el.title = t(k); else if (el.hasAttribute("placeholder")) el.placeholder = t(k); else el.textContent = t(k); });
document.getElementById("mhint").innerHTML = `<kbd>/</kbd> ${t("opens search")} · <kbd>↑</kbd> <kbd>↓</kbd> <kbd>Enter</kbd> ${t("pick a result")} · <kbd>Esc</kbd> ${t("closes")}`;
document.getElementById("tb-search").onclick = openJump;
document.getElementById("mfoot").innerHTML = PAGES.map(p => `<button onclick="pageInfo('${p[0]}')">${t(p[1])}</button>`).join("<span>·</span>");
addEventListener("keydown", e => {
  if (e.key === "Escape") { document.querySelectorAll(".modal.on").forEach(m => m.classList.remove("on")); if (e.target.matches("input")) e.target.blur(); return; }
  if (e.target.id === "jq" && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); moveKb(e.key === "ArrowDown" ? 1 : -1); return; }
  if (e.key === "Enter" && e.target.id === "jq") { (document.querySelector("#jlist .jrow.kb") || document.querySelector("#jlist .jrow"))?.click(); return; }
  if (e.target.matches("input,select,textarea")) return;
  if (document.getElementById("smodal").classList.contains("on")) {
    if (e.key === "ArrowRight") { e.preventDefault(); stepStory(1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); stepStory(-1); }
    return;
  }
  if (document.querySelector(".modal.on")) return;
  if (e.key === "g") { e.preventDefault(); openJump(); return; }
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
  if (e.key === "ArrowLeft") prev();
  if (e.key === "PageDown") { e.preventDefault(); nextSec(); }
  if (e.key === "PageUp") { e.preventDefault(); prevSec(); }
  if (e.key === "Home") go(0);
  if (e.key === "End") go(total - 1);
  if (e.key === "f") document.getElementById("b-full").click();
  if (e.key === "p" && CARDS[cur].k === "event" && CARDS[cur].id === EVENT.id) togglePlay();
  if (e.key === "/") { e.preventDefault(); openJump(); }
});
let tx = 0, ty = 0;
addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
addEventListener("touchend", e => { const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) dx < 0 ? next() : prev(); }, { passive: true });
const storyInAddress = () => { const m = location.pathname.match(/\/stories\/([^/]+)\/?$/) || location.hash.match(/^#story\/(.+)$/); return m ? decodeURIComponent(m[1]) : null; };
addEventListener("hashchange", () => {
  if (location.hash.startsWith("#story/")) return openStoryByKey(storyInAddress());
  const n = parseInt(location.hash.slice(1), 10); if (n && n - 1 !== cur) go(n - 1);
});

refresh();
consentStatus();
leaderboard().forEach(x => lastPos[x.c.id] = `${x.tied ? "T" : ""}${x.pos}`);
const start = parseInt(location.hash.slice(1), 10), startStory = storyInAddress();
go(startStory ? SEC.stories : start ? start - 1 : 0);
if (startStory) openStoryByKey(startStory);
(window.requestIdleCallback || setTimeout)(warmMenu);
/* The page carries the newest stories. Older ones arrive once the first screen is up. */
if (LEAGUE.more_stories) (window.requestIdleCallback || setTimeout)(() =>
  fetch(LEAGUE.more_stories).then(r => r.json()).then(older => { if (!storeRev) { LEAGUE.stories.push(...older); renderFeed(); } }).catch(() => {}));
/* Where the site is served with a content store behind it, the stories come from there: the page asks for the
   store's list when it opens and each time the reader comes back to it, so a story published in the store shows
   without a new page. Anywhere else the request finds nothing and the stories in the page stand. */
function loadStore() {
  fetch(STORE_AT + "content/stories/index.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(ix => {
    if (!ix || !Array.isArray(ix.stories) || ix.rev === storeRev) return;
    const name = ref => (ref || "").split("/").pop();           // an article text already fetched is kept
    const had = Object.fromEntries(LEAGUE.stories.filter(s => s.body).map(s => [s.id, s]));
    ix.stories.forEach(s => { s.body_ref = fromStore(s.body_ref); s.photo = fromStore(s.photo); if (s.photos) s.photos = s.photos.map(fromStore);
      const o = had[s.id]; if (o && name(o.body_ref) === name(s.body_ref)) { s.body = o.body; } });
    storeRev = ix.rev; LEAGUE.stories = ix.stories; LEAGUE.story_count = ix.stories.length;
    renderFeed();
    document.getElementById("hnrow").innerHTML = newsTiles();
    if (wantStory) openStoryByKey(wantStory);                  // the story asked for by address has arrived
    else if (document.getElementById("smodal").classList.contains("on") && rList[rIdx]) showStoryAddress(rList[rIdx]);
  }).catch(() => {});
}
/* The same for everything that is not a story. The store says which package is current; when it is not the one
   this page is showing, the package is fetched and kept on this device. Cards are built once from that content,
   so it is applied by loading the page again: at once when the page has just opened, otherwise on the next visit. */
function loadSite(justOpened) {
  fetch(STORE_AT + "content/site/index.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(ix => {
    if (!ix || !ix.rev || ix.rev === LEAGUE.site_rev) return;
    return fetch(`${STORE_AT}content/site/site.${ix.rev}.json`).then(r => r.ok ? r.json() : Promise.reject(r.status)).then(c => {
      localStorage.setItem("ll.site", JSON.stringify(c));
      if (justOpened && sessionStorage.getItem("ll.site.reloaded") !== c.rev) { sessionStorage.setItem("ll.site.reloaded", c.rev); location.reload(); }
    });
  }).catch(() => {});
}
(window.requestIdleCallback || setTimeout)(() => { loadStore(); loadSite(true); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadStore(); loadSite(false); } });
</script>
