      <span class="pts ${final ? "" : "prov"}">${x.pts}</span></div>`).join("");
}
function fmtTee(cid) {
  const first = Math.min(...LEAGUE.players.filter(p => p.city === cid).map(p => TEE[p.id].r2));
  return fmt(first);
}
function detail() {
  const el = document.getElementById("lv-detail");
  if (!state.sel) { el.innerHTML = `<div class="legend">${t("Hole by hole")}</div><p class="lead" style="font-size:13px">${t("Select a city on the board. You get every player's card for the round, the two balls that count on each hole ringed in gold, and the team line underneath. Holes where part of the team is still on course are marked provisional.")}</p>`; return; }
  const c = CITY[state.sel], tr = teamRound(c.id, state.round);
  const rows = tr.rows.map(r => ({ pid: r.pid, label: lastName(PLAYER[r.pid].name), sub: PLAYER[r.pid].captain ? "C" : "", holes: r.holes }));
  el.innerHTML = `<div class="legend"><span><i class="sw" style="--c:${c.color}"></i>${esc(c.name)} · ${state.round === "r1" ? t("Round 1 · final") : tr.firm ? t("Round 2 · final") : `${t("Round 2 · thru")} ${tr.thru}`}</span>
    <span class="rt"><button class="${state.round === "r1" ? "on" : ""}" onclick="setRound('r1')">R1</button><button class="${state.round === "r2" ? "on" : ""}" onclick="setRound('r2')">R2</button></span></div>
    ${holeGrid(rows, tr, t("Player"))}${LEGEND()}`;
}
function refresh() {
  const lb = leaderboard();
  const final = allFinal(lb);
  document.getElementById("lv-lb").innerHTML = lbRows(lb, false);
  document.getElementById("story-lb").innerHTML = lbRows(lb.slice(0, 5), false);
  document.getElementById("ev-lb").innerHTML = lbRows(lb.slice(0, 6), true);
  document.getElementById("lv-clock").textContent = fmt(state.clock);
  document.getElementById("lv-upd").textContent = fmt(state.feedClock) + (state.stale ? " ⚠" : "");
  document.getElementById("lv-status").textContent = final ? t("Round 2 · final") : t("Round 2 · live");
  document.getElementById("lv-prov").textContent = final ? t("Final · points awarded") : t("Provisional");
  document.getElementById("ss-note").textContent = final ? t("Final after Mayakoba") : t("Provisional while play is on");
  document.getElementById("lv-banner").classList.toggle("on", state.stale);
  document.getElementById("lv-stale-t").textContent = fmt(state.feedClock);
  document.getElementById("lv-stale").classList.toggle("on", state.stale);
  document.getElementById("lv-stale").textContent = state.stale ? t("Feed back online") : t("Simulate feed outage");
  document.getElementById("lv-play").textContent = state.playing ? t("❚❚ Pause replay") : t("▶ Replay scores");
  document.getElementById("lv-play").classList.toggle("on", state.playing);
  detail();
  // season bars
  const max = Math.max(...lb.map(x => x.pts));
  document.getElementById("ss-bars").innerHTML = lb.map(x => `<div class="bar" style="--c:${x.c.color}"><span class="cd">${x.c.short}</span><span class="tr"><i style="width:${x.pts / max * 100}%"></i></span><b>${x.pts}</b></div>`).join("");
  // city cards
  lb.forEach((x, i) => {
    const st = document.querySelector(`[data-standing="${x.c.id}"]`);
    st.innerHTML = `<b>${x.tied ? "T" : ""}${x.pos}<span style="font-size:.5em;letter-spacing:0">${x.tied || LANG === "es" ? (LANG === "es" ? "º" : "") : ord(x.pos).slice(-2)}</span></b><span><b style="color:var(--acc)">${x.pts}</b> ${t("league points")}${final ? "" : " " + t("projected")} · ${t("after")} ${final ? t("1 of 6 events") : t("0 of 6 events")}</span>`;
    const cl = document.querySelector(`[data-citylive="${x.c.id}"]`);
    cl.innerHTML = `<div class="cell"><small>${t("Position")}</small><b>${x.tied ? "T" : ""}${x.pos}</b></div><div class="cell"><small>${t("Total")}</small><b class="${cls(x.total)}">${sgn(x.total)}</b></div><div class="cell"><small>${t("Round 1")}</small><b class="${cls(x.r1.toPar)}">${sgn(x.r1.toPar)}</b></div><div class="cell"><small>${t("Round 2")}</small><b class="${cls(x.today)}">${x.thru ? sgn(x.today) + (x.thru < 18 ? `<span style="font-size:.55em;color:var(--dim2);margin-left:4px">${t("thru")} ${x.thru}</span>` : "") : "–"}</b></div>`;
  });
  // player live figures on tiles + player cards
  LEAGUE.players.forEach(p => {
    const h1 = playerHoles("r1", p.id), h2 = playerHoles("r2", p.id);
    const tp = arr => arr.reduce((a, s, h) => s == null ? a : a + s - PAR[h], 0);
    const done2 = h2.filter(x => x != null).length;
    const tl = document.querySelector(`[data-plive="${p.id}"]`);
    if (tl) tl.innerHTML = `<span class="${cls(tp(h1) + tp(h2))}">${sgn(tp(h1) + tp(h2))}</span><small>${done2 === 18 ? "F" : done2 ? t("thru") + " " + done2 : t("tee") + " " + fmt(TEE[p.id].r2)}</small>`;
    const t1 = teamRound(p.city, "r1"), t2 = teamRound(p.city, "r2");
    const counted = [...t1.holes, ...t2.holes].filter(x => x.counted.includes(p.id)).length;
    const played = h1.length + done2;
    const birdies = [...h1, ...h2].filter((s, i) => s != null && s - PAR[i % 18] < 0).length;
    const r1tot = h1.reduce((a, b) => a + b, 0);
    const stats = document.querySelector(`[data-pstats="${p.id}"]`);
    stats.innerHTML = `<div class="cell"><small>${t("Event")}</small><b class="${cls(tp(h1) + tp(h2))}">${sgn(tp(h1) + tp(h2))}</b></div><div class="cell"><small>${t("Round 1")}</small><b>${r1tot}</b></div><div class="cell"><small>${t("Birdies+")}</small><b>${birdies}</b></div><div class="cell"><small>${t("Balls counted")}</small><b>${played ? Math.round(counted / played * 100) : 0}%</b></div>`;
    const holes = document.querySelector(`[data-pholes="${p.id}"]`);
    holes.innerHTML = holeGrid([{ pid: p.id, label: t("Round 1"), holes: h1 }], null, t("Hole")) +
      `<div style="height:10px"></div>` + holeGrid([{ pid: p.id, label: t("Round 2"), sub: done2 < 18 ? (done2 ? `${t("thru")} ${done2}` : `${t("tee")} ${fmt(TEE[p.id].r2)}`) : "F", holes: h2 }], null, t("Hole"));
    // ring the counted ones for this player across both grids
    [["r1", t1, 0], ["r2", t2, 1]].forEach(([rid, tr, gi]) => {
      const grid = holes.querySelectorAll(".scg")[gi];
      const cells = grid.querySelectorAll(".sq:not(.none)");
      let k = 0; tr.holes.forEach((x, h) => { if (SCORE[rid][p.id][h] != null && (rid === "r1" || posted(rid, p.id, h))) { if (x.counted.includes(p.id)) cells[k]?.classList.add("cnt"); k++; } });
    });
  });
  document.querySelectorAll("[data-follow]:not(#feed [data-follow])").forEach(b => {
    const on = state.follow.has(b.dataset.follow); b.classList.toggle("on", on);
    b.textContent = (on ? t("Following") : t("Follow")) + (CITY[b.dataset.follow] ? " " + CITY[b.dataset.follow].short : "");
  });
  renderFeed();
  // automated alerts from the scoring feed: position change for a followed city,
  // a new round leader, and the final result once the last group signs
  if (lastLeader && lb[0].c.id !== lastLeader && !lb[0].tied) toast(`${t("New round leader")}: ${lb[0].c.name}`, `${sgn(lb[0].total)} ${t("overall, {today} today thru {thru}. Round 2 is live.").replace("{today}", sgn(lb[0].today)).replace("{thru}", lb[0].thru)}`, t("scoring feed"));
  lastLeader = lb[0].tied ? lastLeader : lb[0].c.id;
  lb.forEach(x => {
    const key = `${x.tied ? "T" : ""}${x.pos}`;
    if (state.follow.has(x.c.id) && lastPos[x.c.id] && lastPos[x.c.id] !== key)
      toast(`${x.c.name} ${t("now")} ${key} · Mayakoba`, `${sgn(x.total)} ${t("overall, {today} today thru {thru}. Round 2 is live.").replace("{today}", sgn(x.today)).replace("{thru}", x.thru)}`, t("city follow"));
    lastPos[x.c.id] = key;
  });
  if (final && !finalSeen) { finalSeen = true; lb.filter(x => state.follow.has(x.c.id)).slice(0, 1).forEach(x =>
    toast(`${t("Final at Mayakoba")}: ${x.c.name} ${t("finishes")} ${x.tied ? "T" : ""}${x.pos}`, `${sgn(x.total)} · ${x.pts} ${t("league points. Season standings updated.")}`, t("scoring feed"))); }
  if (!final) finalSeen = false;
}

/* ------------------------------------------------------------ actions */
let tickTimer = null;
function tick() {
  state.clock += 2;
  if (!state.stale) state.feedClock = state.clock;
  if (state.clock > 15 * 60 + 50) { state.playing = false; clearInterval(tickTimer); tickTimer = null; }
  refresh();
}
function togglePlay() { state.playing = !state.playing; if (state.playing) tickTimer = setInterval(tick, 700); else { clearInterval(tickTimer); tickTimer = null; } refresh(); }
function toggleStale() { state.stale = !state.stale; if (!state.stale) state.feedClock = state.clock; refresh(); }
function resetClock() { state.clock = state.feedClock = h0 * 60 + m0; state.stale = false; refresh(); }
function selectCity(id) { state.sel = state.sel === id ? null : id; PREF.set("sel", state.sel); refresh(); }
function setRound(r) { state.round = r; PREF.set("round", r); refresh(); }
function toggleFollow(id) { state.follow.has(id) ? state.follow.delete(id) : state.follow.add(id); PREF.set("follow", [...state.follow]); refresh();
  if (state.follow.has(id)) toast(`${t("Following")} ${CITY[id] ? CITY[id].name : PLAYER[id].name}`, t("You will get round leaders, final results and tee times. Stored on this device; no account."), t("city follow")); }
function goCity(id) { go(CARDS.findIndex(c => c.k === "city" && c.id === id)); }
function goPlayer(id) { go(CARDS.findIndex(c => c.k === "player" && c.id === id)); }
function previewAlerts() {
  const lb = leaderboard(), top = lb[0], mine = lb.find(x => state.follow.has(x.c.id)) || lb[2];
  const seq = [
    [t("Play is under way at El Camaleón"), t("First group off the 1st tee at 08:00. Follow your city for round leaders and the final result."), t("scoring feed")],
    [`${t("New round leader")}: ${top.c.name}`, `${sgn(top.total)} ${t("overall, {today} today thru {thru}. Round 2 is live.").replace("{today}", sgn(top.today)).replace("{thru}", top.thru || 18)}`, t("scoring feed")],
    [`${t("Final at Mayakoba")}: ${mine.c.name} ${t("finishes")} ${mine.tied ? "T" : ""}${mine.pos}`, `${sgn(mine.total)} · ${mine.pts} ${t("league points. Season standings updated.")}`, t("city follow")],
  ];
  seq.forEach((a, i) => setTimeout(() => toast(...a), i * 2600));
}
function consentStatus() {
  const d = PREF.get("consent", null), ok = document.getElementById("consent-ok"); if (!ok) return;
  if (!d) { ok.hidden = true; return; }
  ok.hidden = false;
  ok.innerHTML = `${t("Consent recorded (demo, this device only)")}: ${esc(d.email)} · ${CITY[d.city] ? esc(CITY[d.city].name) : ""} · ${t("email")} ${d.c_email ? t("yes") : t("no")} · ${t("SMS")} ${d.c_sms ? t("yes") : t("no")} · ${t("mission")} ${d.c_mission ? t("yes") : t("no")} · ${new Date(d.at).toLocaleString(LANG === "es" ? "es-MX" : "en-US")}
    <br><button class="pill" style="margin-top:8px" onclick="withdrawConsent()">${t("Withdraw consent")}</button>`;
}
function saveConsent(f) {
  const d = Object.fromEntries(new FormData(f).entries());
  PREF.set("consent", { ...d, at: new Date().toISOString() });
  consentStatus();
  if (!state.follow.has(d.city)) toggleFollow(d.city);
  return false;
}
function withdrawConsent() { try { localStorage.removeItem("ll.consent"); } catch (e) {} consentStatus(); toast(t("Withdraw consent"), t("Consent withdrawn. Nothing kept on this device.")); }
let toastT = null;
function toast(b, s, kind) { const el = document.getElementById("toast"); el.querySelector("b").textContent = b; el.querySelector("span").textContent = s;
  el.querySelector("small").textContent = `${t("Push alert preview")} · ${kind || t("city follow")}`;
  el.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("on"), 4200); }

function jumpEntries() {
  return CARDS.map((c, n) => {
    if (c.k === "story") return { n, sec: t("Start"), label: `${t("Cities.")} ${t("Legends.")} ${t("A cause.")}`, sub: t("League"), color: "var(--acc)" };
    if (c.k === "live") return { n, sec: t("Start"), label: `${t("Live")} · Mayakoba`, sub: t("Round 2"), color: "var(--live)" };
    if (c.k === "stories") return { n, sec: t("Start"), label: t("Stories"), sub: `${LEAGUE.stories.length} ${t("posts")}`, color: "var(--acc)" };
    if (c.k === "city") { const ci = CITY[c.id]; return { n, sec: t("City hubs"), label: ci.name, sub: ci.short, color: ci.color, q: ci.teams.join(" ") }; }
    if (c.k === "player") { const pl = PLAYER[c.id], ci = CITY[pl.city]; return { n, sec: t("Players"), label: pl.name, sub: `${ci.short}${pl.captain ? " · C" : ""} · ${pl.team ? pl.sport : L(pl, "role")}`, color: ci.color, q: `${ci.name} ${pl.team || ""} ${pl.role}` }; }
    if (c.k === "season") return { n, sec: t("Season"), label: t("Schedule and standings"), sub: t("6 events"), color: "var(--acc)" };
    if (c.k === "event") return { n, sec: t("Season"), label: t("Mayakoba · event page"), sub: t("24–29 January 2027"), color: "var(--acc)" };
    if (c.k === "capture") return { n, sec: t("Season"), label: t("Follow your city"), sub: t("No account needed"), color: "var(--green)" };
    return { n, sec: t("Season"), label: t("The mission"), sub: t("988 · get involved"), color: "var(--green)" };
  });
}
const JUMP = jumpEntries();
function renderJump(q) {
  q = norm((q || "").trim());
  const words = q.split(/\s+/).filter(Boolean);
  const hit = e => !words.length || words.every(w => norm(`${e.label} ${e.sub} ${e.sec} ${e.q || ""}`).includes(w));
  let sec = null, out = "";
  JUMP.filter(hit).forEach(e => {
    if (e.sec !== sec) { sec = e.sec; out += `<h5>${sec}</h5>`; }
    out += `<button class="jrow ${e.n === cur ? "sel" : ""}" style="--c:${e.color}" onclick="closeModal('jmodal');go(${e.n})"><span class="jn">${e.n + 1}</span><i></i><b>${esc(e.label)}</b><small>${esc(e.sub)}</small></button>`;
  });
  const pages = PAGES.filter(p => !words.length || words.every(w => norm(`${t(p[1])} ${t("More")}`).includes(w)));
  if (pages.length) out += `<h5>${t("More")}</h5>` + pages.map(p => `<button class="jrow" style="--c:var(--dim2)" onclick="pageInfo('${p[0]}')"><span class="jn">·</span><i></i><b>${t(p[1])}</b></button>`).join("");
  document.getElementById("jlist").innerHTML = out || `<div class="empty" style="grid-column:1/-1">${t("Nothing matches.")}</div>`;
}
function openJump() {
  const q = document.getElementById("jq"); q.value = ""; renderJump("");
  document.getElementById("jmodal").classList.add("on");
  setTimeout(() => { q.focus(); document.querySelector("#jlist .jrow.sel")?.scrollIntoView({ block: "center" }); }, 30);
}
function closeModal(id) { document.getElementById(id).classList.remove("on"); }

/* --------------------------------------------------------- navigation */
function go(n) {
  const target = Math.max(0, Math.min(total - 1, n));
  // a long jump (tab, chip, hash) cuts straight there: sliding across seventy
  // cards would lay every one of them out on the way
  film.style.transition = Math.abs(target - cur) > 3 ? "none" : "";
  cur = target;
  film.style.transform = `translateX(${-cur * 100}vw)`;
  document.getElementById("count").innerHTML = `<b>${cur + 1}</b> / ${total}`;
  const k = CARDS[cur].k;
  const sec = k === "live" ? "live" : k === "stories" ? "stories" : k === "city" ? "cities" : k === "player" ? "players" : ["season", "event", "capture", "mission"].includes(k) ? "season" : null;
  document.querySelectorAll("#tb-tabs button[data-sec]").forEach(b => b.classList.toggle("on", b.dataset.sec === sec));
  document.getElementById("tb-ctx").textContent = k === "story" ? t("· 2027 season") : k === "live" ? t("· Mayakoba · live") : k === "stories" ? t("· Stories") :
    k === "city" ? `· ${t("City hubs")} · ${cur - SEC.cities + 1} / ${cityOrder.length}` : k === "player" ? `· ${t("Players")} · ${cur - SEC.players + 1} / ${playerOrder.length}` : t("· Season");
  location.hash = cur ? "#" + (cur + 1) : "";
  film.children[cur].querySelector(".inner").scrollTop = 0;
}
const next = () => go(cur + 1 >= total ? 0 : cur + 1), prev = () => go(cur - 1);
document.getElementById("b-next").onclick = next;
document.getElementById("b-prev").onclick = prev;
document.getElementById("b-first").onclick = () => go(0);
document.getElementById("count").onclick = openJump;
document.getElementById("b-full").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
document.querySelectorAll("#tb-tabs button[data-sec]").forEach(b => { b.textContent = t(b.textContent.trim()); b.onclick = () => go(SEC[b.dataset.sec]); });
document.getElementById("tb-lang").onclick = () => setLang(LANG === "es" ? "en" : "es");
document.getElementById("tb-lang").textContent = LANG === "es" ? "EN" : "ES";
// static chrome strings
document.querySelectorAll("[data-t]").forEach(el => { const k = el.dataset.t; if (el.hasAttribute("title")) el.title = t(k); else if (el.hasAttribute("placeholder")) el.placeholder = t(k); else el.textContent = t(k); });
document.getElementById("mhint").innerHTML = `<kbd>g</kbd> ${t("opens this index")} · <kbd>←</kbd> <kbd>→</kbd> ${t("move through the film")} · <kbd>Esc</kbd> ${t("closes")}`;
document.getElementById("mfoot").innerHTML = PAGES.map(p => `<button onclick="pageInfo('${p[0]}')">${t(p[1])}</button>`).join("<span>·</span>");
addEventListener("keydown", e => {
  if (e.key === "Escape") { document.querySelectorAll(".modal.on").forEach(m => m.classList.remove("on")); if (e.target.matches("input")) e.target.blur(); return; }
  if (e.key === "Enter" && e.target.id === "jq") { document.querySelector("#jlist .jrow")?.click(); return; }
  if (e.target.matches("input,select,textarea")) return;
  if (document.getElementById("smodal").classList.contains("on")) {
    if (e.key === "ArrowRight") { e.preventDefault(); stepStory(1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); stepStory(-1); }
    return;
  }
  if (document.querySelector(".modal.on")) return;
  if (e.key === "g") { e.preventDefault(); openJump(); return; }
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); next(); }
  if (e.key === "ArrowLeft") prev();
  if (e.key === "Home") go(0);
  if (e.key === "End") go(total - 1);
  if (e.key === "f") document.getElementById("b-full").click();
  if (e.key === "p" && CARDS[cur].k === "live") togglePlay();
  if (e.key === "/" && CARDS[cur].k === "stories") { e.preventDefault(); document.getElementById("st-q").focus(); }
});
let tx = 0, ty = 0;
addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
addEventListener("touchend", e => { const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) dx < 0 ? next() : prev(); }, { passive: true });
addEventListener("hashchange", () => { const n = parseInt(location.hash.slice(1), 10); if (n && n - 1 !== cur) go(n - 1); });

refresh();
consentStatus();
leaderboard().forEach(x => lastPos[x.c.id] = `${x.tied ? "T" : ""}${x.pos}`);
const start = parseInt(location.hash.slice(1), 10);
go(start ? start - 1 : 0);
</script>
