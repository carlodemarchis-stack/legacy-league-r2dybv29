bio: First baseman for the Chicago White Sox from 2003 to 2010, and a champion with the club. Eight seasons on the South Side, one team, one ring. Golf was an off-day habit while he played; after retiring he took it up seriously and now plays off a 7.8 handicap. He joined the league to compete again for the city that cheered him on.
bio_es: Primera base de los Chicago White Sox de 2003 a 2010 y campeón con el club. Ocho temporadas en el South Side, un solo equipo, un anillo. El golf era una afición de días libres mientras jugaba; al retirarse se lo tomó en serio y hoy juega con hándicap 7.8. Entró en la liga para volver a competir por la ciudad que lo aclamó.
